name: Kota Nusa Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kota-nusa-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Integrity, JavaScript, and JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Rumahku integrity test
        run: node tests/rumahku.integrity.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function collectJsonFiles(directory) {
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) files.push(...collectJsonFiles(fullPath));
              else if (entry.isFile() && entry.name.endsWith('.json')) files.push(fullPath);
            }
            return files;
          }

          const files = collectJsonFiles('.');
          if (files.length === 0) throw new Error('No JSON files found to validate.');
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`Valid JSON: ${file}`);
          }
          NODE
