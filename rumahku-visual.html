<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a3a2e">
<title>Rumahku</title>
<style>
:root{--g:#1a3a2e;--bg:#dcebe3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;gap:10px;align-items:center;padding:8px 12px 2px}
.rb{width:50px;height:50px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.rb svg,.nb i svg,.vb svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.rb:active,.nb:active,.vb:active{transform:scale(.94)}
.ttl{flex:1;min-width:0;background:var(--g);color:#fff;border-radius:26px;padding:8px 20px;box-shadow:0 6px 14px rgba(26,58,46,.25)}
.ttl b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.ttl span{font-size:14px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{text-align:center;color:#3c5a4c;font-size:14px;padding:6px 8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvw{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(26,58,46,.88);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.vb{position:absolute;bottom:12px;left:12px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(26,58,46,.82);display:grid;place-items:center;padding:0}
.vb.r{left:auto;right:12px}
.bar{margin:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--g);border-radius:30px;padding:10px 6px 8px;display:grid;grid-template-columns:repeat(4,1fr)}
.nb{appearance:none;border:0;background:none;color:#fff;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0}
.nb i{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.home-chat{position:absolute;z-index:4;left:10px;top:10px;display:flex;align-items:flex-start;gap:6px}
.home-chat>button{border:0;border-radius:15px;background:rgba(26,58,46,.92);color:#fff;padding:9px 12px;font:700 13px system-ui}
.home-chat form{display:none;background:rgba(255,255,255,.96);padding:5px;border-radius:15px;box-shadow:0 5px 18px rgba(0,0,0,.2)}
.home-chat.open form{display:flex}
.home-chat input{width:min(50vw,210px);border:0;outline:0;background:transparent;padding:7px;font:14px system-ui}
.home-chat form button{border:0;border-radius:11px;background:var(--g);color:#fff;padding:0 11px;font-weight:800}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);background:var(--g);color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hint,.toast{transition:none}}
</style></head><body>
<div id="app">
  <div class="hd">
    <button class="rb" data-a="kembali" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><b>Rumahku</b><span id="nm"></span></div>
    <button class="rb" data-a="naik" aria-label="Naik"><svg viewBox="0 0 24 24"><path d="M12 20V5M6 10l6-6 6 6"/></svg></button>
  </div>
  <div class="sub" id="lv"></div>
  <div class="cvw"><canvas id="cv"></canvas><div class="hint" id="hint">Ketuk tanah untuk berjalan · geser untuk bergerak · ◀ ▶ putar sisi rumah</div>
    <button class="vb" id="vl" aria-label="Lihat sisi kiri"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5"/></svg></button>
    <button class="vb r" id="vr" aria-label="Lihat sisi kanan"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5"/></svg></button>
    <div class="home-chat" id="homeChat"><button id="chatOpen" type="button">Chat</button><form id="chatForm"><input id="chatInput" maxlength="80" autocomplete="off" placeholder="Tulis ke teman…"><button type="submit">Kirim</button></form></div>
    <div class="toast" id="toast"></div></div>
  <div class="bar" style="grid-template-columns:repeat(5,1fr)">
    <button class="nb" data-a="kebun"><i style="background:#3b8a3e"><svg viewBox="0 0 24 24"><path d="M12 21v-9M12 12C12 8 9 6 5 6c0 4 3 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/></svg></i>Kebun</button>
    <button class="nb" id="en" data-a="masuk"><i style="background:#d88420"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M6 10v10h12V10M10 20v-6h4v6"/></svg></i><span>Masuk</span></button>
    <button class="nb" data-a="hias"><i style="background:#1f93a3"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg></i>Hias</button>
    <button class="nb" data-a="upgrade"><i style="background:#f2a81d"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9M12 16V10M9 12l3-3 3 3"/></svg></i>Upgrade</button>
    <button class="nb" data-a="kunjungi"><i style="background:#8a55c4"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 4.5a3.5 3.5 0 010 7M18 14c2 .8 3 3 3 6"/></svg></i>Kunjungi</button>
  </div>
</div>

document.getElementById('vl').addEventListener('click',function(){rot=(rot+3)%4;say(['Tampak depan','Sisi kiri','Tampak belakang','Sisi kanan'][rot])});
document.getElementById('vr').addEventListener('click',function(){rot=(rot+1)%4;say(['Tampak depan','Sisi kiri','Tampak belakang','Sisi kanan'][rot])});
var chatBox=document.getElementById('homeChat'),chatInput=document.getElementById('chatInput');
document.getElementById('chatOpen').addEventListener('click',function(){chatBox.classList.toggle('open');if(chatBox.classList.contains('open'))chatInput.focus()});
document.getElementById('chatForm').addEventListener('submit',function(e){e.preventDefault();var text=chatInput.value.replace(/[<>\u0000-\u001f]/g,'').trim().slice(0,80);if(!text)return;emit('chat',{text:text});chatInput.value='';chatBox.classList.remove('open')});
function setCfg(o){cfg=Object.assign({nama:'Rumah Udin123',level:10,max:10,celebrity:false,decor:'sage'},window.RUMAHKU||{},o||{});window.RUMAHKU=cfg;build()}
window.rumahkuSet=setCfg;window.addEventListener('rumahku:data',function(e){setCfg(e.detail)});
window.rumahkuSocialSet=function(o){SOC=Object.assign(SOC,o||{});if(typeof o?.inside==='boolean'){if(o.inside&&!INS)enter();else if(!o.inside&&INS)leave()}document.getElementById('chatOpen').style.display=SOC.session?'':'none';UI()};
window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data)return;if(e.data.type==='rumahku:data')setCfg(e.data.detail);if(e.data.type==='rumahku:social')window.rumahkuSocialSet(e.data.detail)});
window.__rumahku={enter:enter,leave:leave,rot:function(r){rot=r},frame:function(){step(.016);frame()}};
addEventListener('resize',resize);resize();setCfg();requestAnimationFrame(loop);
})();
</script></body></html>
