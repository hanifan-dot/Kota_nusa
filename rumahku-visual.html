<!doctype html>
<html lang="id"><head><meta charset="utf-8">

<title>Rumahku · Kota Nusa</title>
<style>
:root{--g:#1a3a2e;--bg:#dcebe3}
*{box-sizing:border-box}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;gap:10px;align-items:center;padding:8px 12px 2px}
.rb{width:50px;height:50px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.rb svg,.nb i svg,.vb svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

.ttl span{font-size:14px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{text-align:center;color:#3c5a4c;font-size:14px;padding:6px 8px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvw{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(26,58,46,.88);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.vb{position:absolute;bottom:12px;left:12px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(26,58,46,.82);display:grid;place-items:center;padding:0}
.vb.r{left:auto;right:12px}
.bar{margin:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--g);border-radius:30px;padding:10px 6px 8px;display:grid;grid-template-columns:repeat(4,1fr)}
.nb{appearance:none;border:0;background:none;color:#fff;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0}
.nb i{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.nb[data-a="hias"]{position:relative}
.nb[data-a="hias"]::after{content:"COMING SOON";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:7px;font-weight:900;letter-spacing:.35px;color:#17382a;background:#fff4bf;border-radius:999px;padding:3px 5px;white-space:nowrap;box-shadow:0 2px 6px #0002}
.toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);background:var(--g);color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.hint,.toast{transition:none}}
</style></head><body>

/* ---------- gambar dunia ---------- */

/* ---------- karakter & input ---------- */
var ch={x:9,y:14.6,z:0,dir:1,t:0,mv:0,stuck:0,o:null},cam={x:0,y:0},tgt=null,fx=null,pt=null,hintT=5;
function blk(x,y){
  if(x<.9||y<.9||x>N-.9||y>N-.9)return true;var i,r;
  for(i=0;i<COL.length;i++){r=COL[i];if(x>r[0]-.22&&x<r[2]+.22&&y>r[1]-.22&&y<r[3]+.22)return true}
  for(i=0;i<CIR.length;i++){r=CIR[i];if(Math.hypot(x-r[0],y-r[1])<r[2]+.22)return true}
  return false}
function world(px,py){var sx=(px-W/2)/S+cam.x,sy=(py-H*.56)/S+cam.y,a=sx/(TW/2),b=sy/(TH/2),u=(a+b)/2,v=(b-a)/2,w=RI(u,v);return{x:w[0],y:w[1]}}
function dirScr(dx,dy){var a=dx/(TW/2),b=dy/(TH/2),w=UV((a+b)/2,(b-a)/2),l=Math.hypot(w[0],w[1])||1;return{x:w[0]/l,y:w[1]/l}}
function resize(){var r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width||360;H=r.height||600;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);S=clamp(W/560,.5,.95)}
function down(e){var r=cv.getBoundingClientRect();pt={id:e.pointerId,x0:e.clientX-r.left,y0:e.clientY-r.top,x:0,y:0,t:performance.now(),drag:false};pt.x=pt.x0;pt.y=pt.y0;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
function move(e){if(!pt||e.pointerId!==pt.id)return;var r=cv.getBoundingClientRect();pt.x=e.clientX-r.left;pt.y=e.clientY-r.top;if(!pt.drag&&Math.hypot(pt.x-pt.x0,pt.y-pt.y0)>12){pt.drag=true;tgt=null}}
function up(e){if(!pt||e.pointerId!==pt.id)return;
  if(!pt.drag&&performance.now()-pt.t<450){var w=world(pt.x,pt.y);w.x=clamp(w.x,1,N-1);w.y=clamp(w.y,1,N-1);tgt=w;fx={x:w.x,y:w.y,t:0};ch.stuck=0;
    if(Math.hypot(w.x-SIGN.x,w.y-SIGN.y)<1.3)emit('kebun-belakang')}
  pt=null}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',function(){pt=null});
var keys={};addEventListener('keydown',function(e){keys[e.key]=1});addEventListener('keyup',function(e){keys[e.key]=0});
function walk(o,v,sp){var ox=o.x,oy=o.y;if(!blk(o.x+v.x*sp,o.y))o.x+=v.x*sp;if(!blk(o.x,o.y+v.y*sp))o.y+=v.y*sp;return Math.hypot(o.x-ox,o.y-oy)}
function step(dt){
  var v=null,i,k;T+=dt;
  if(pt&&pt.drag){var dx=pt.x-pt.x0,dy=pt.y-pt.y0;if(Math.hypot(dx,dy)>10)v=dirScr(dx,dy)}
  else if(keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown){tgt=null;v=dirScr((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0))}
  else if(tgt){var rx=tgt.x-ch.x,ry=tgt.y-ch.y,l=Math.hypot(rx,ry);if(l<.12)tgt=null;else v={x:rx/l,y:ry/l}}
  ch.mv=0;
  if(v){var sp=3.2*dt,m=walk(ch,v,sp);ch.mv=m>sp*.15?1:0;
    if(tgt){ch.stuck=m<sp*.3?ch.stuck+dt:0;if(ch.stuck>.3)tgt=null}
    var sv=R(ch.x+v.x*.1,ch.y+v.y*.1),sc=R(ch.x,ch.y),sdx=(sv[0]-sv[1])-(sc[0]-sc[1]);if(sdx>.004)ch.dir=1;else if(sdx<-.004)ch.dir=-1}
  if(ch.mv)ch.t+=dt;
  var hz=0;for(i=0;i<DK.length;i++){k=DK[i];if(ch.x>k[0]&&ch.x<k[2]&&ch.y>k[1]&&ch.y<k[3])hz=Math.max(hz,k[4])}ch.z+=(hz-ch.z)*Math.min(1,dt*14);
  // NPC: jalan sangat lambat, jarang
  if(NPC){NPC.mv=0;if(NPC.w>0){NPC.w-=dt}else{var tx=NPC.to?15.2:3.6,d=tx-NPC.x;if(Math.abs(d)<.1){NPC.to=!NPC.to;NPC.w=24+rnd(T)*20}else{var mm=walk(NPC,{x:d>0?1:-1,y:0},.5*dt);NPC.mv=1;NPC.t+=dt*.5;NPC.dir=NPC.dir=d>0?(rot==0||rot==3?1:-1):(rot==0||rot==3?-1:1);if(mm<.002){NPC.to=!NPC.to;NPC.w=10}}}
    NPC.o.x=NPC.x;NPC.o.y=NPC.y}
  ch.o.x=ch.x;ch.o.y=ch.y;
  var p=P(ch.x,ch.y),kk=1-Math.pow(.002,dt);cam.x+=(p[0]-cam.x)*kk;cam.y+=(p[1]+30-cam.y)*kk;
  if(fx){fx.t+=dt*2.2;if(fx.t>1)fx=null}
  if(hintT>0){hintT-=dt;if(hintT<=0||pt)document.getElementById('hint').style.opacity=0}}

/* ---------- frame ---------- */
function frame(){

  c.setTransform(DPR,0,0,DPR,0,0);
  g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,NIGHT?'#1f2c4e':'#cfe9ee');g.addColorStop(1,NIGHT?'#34506a':'#e4f1dc');c.fillStyle=g;c.fillRect(0,0,W,H);

  for(i=0;i<IT.length;i++){var q=R(IT[i].x,IT[i].y);IT[i].k=q[0]+q[1]+(IT[i]===ch.o?.03:0)}
  IT.sort(function(a,b){return a.k-b.k});

    c.save();c.translate(W/2,H*.56);c.scale(S,S);c.translate(-cam.x,-cam.y);c.globalCompositeOperation='lighter';
    for(i=0;i<GLW.length;i++){var w=GLW[i],r=w[2]?30:20;g=c.createRadialGradient(w[0],w[1],1,w[0],w[1],r);g.addColorStop(0,'rgba(255,200,110,.5)');g.addColorStop(1,'rgba(255,200,110,0)');c.fillStyle=g;c.fillRect(w[0]-r,w[1]-r,r*2,r*2)}
    c.restore()}
  if(pt&&pt.drag){c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;c.beginPath();c.arc(pt.x0,pt.y0,34,0,6.2832);c.stroke();circ(pt.x0+clamp(pt.x-pt.x0,-34,34),pt.y0+clamp(pt.y-pt.y0,-34,34),14,'rgba(255,255,255,.7)')}
}
