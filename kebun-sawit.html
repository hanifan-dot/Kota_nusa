<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8fd3f4">
<title>Kebun Sawit Nusa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
#kebunSawit{position:fixed;inset:0;z-index:2147483000;background:#bfe6f5;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
#kebunSawit *{box-sizing:border-box}
#kebunSawit canvas{position:absolute;inset:0;display:block}
#kebunSawit .ks-col{position:absolute;top:0;bottom:0;left:50%;width:min(100vw,520px);transform:translateX(-50%);pointer-events:none}
#kebunSawit .ks-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#kebunSawit .ks-pill{pointer-events:auto;background:rgba(40,28,14,.72);border:2px solid rgba(255,255,255,.5);border-radius:99px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
#kebunSawit .ks-coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffc928 60%,#c98a00);border:2px solid #9a6a00;display:inline-block}
#kebunSawit .ks-ib{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(40,28,14,.72);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#kebunSawit .ks-ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#kebunSawit .ks-ib:active{transform:scale(.92)}
#kebunSawit .ks-right{display:flex;gap:8px}
#kebunSawit .ks-title{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:0;right:0;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #2f6a2a,0 4px 10px rgba(0,0,0,.35);letter-spacing:.01em}
#kebunSawit .ks-bot{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;align-items:center}
#kebunSawit .ks-btn{pointer-events:auto;appearance:none;border:0;border-radius:16px;background:linear-gradient(180deg,#ffb23f,#f0780a);color:#fff;font:inherit;font-weight:900;font-size:22px;padding:14px 28px;min-height:56px;width:100%;max-width:360px;box-shadow:0 6px 0 #9b4a05,0 12px 22px rgba(0,0,0,.3);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#kebunSawit .ks-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9b4a05}
#kebunSawit .ks-btn[disabled]{background:linear-gradient(180deg,#8d8a82,#6f6c64);box-shadow:0 6px 0 #4a4842,0 12px 22px rgba(0,0,0,.25);cursor:default;font-size:17px}
#kebunSawit .ks-hint{font-size:13px;font-weight:700;color:#fff;background:rgba(40,28,14,.6);border-radius:99px;padding:5px 14px;text-align:center}
#kebunSawit .ks-buy{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none;background:linear-gradient(180deg,rgba(20,14,6,0) 25%,rgba(20,14,6,.55) 100%)}
#kebunSawit .ks-buy[hidden]{display:none}
#kebunSawit .ks-card{pointer-events:auto;background:#fff8e6;color:#3a2a12;border-radius:20px;padding:18px;width:min(100%,380px);display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.4);text-align:left}
#kebunSawit .ks-card h2{margin:0;font-size:22px;line-height:1.15}
#kebunSawit .ks-card ul{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
#kebunSawit .ks-price{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;border-top:2px dashed #d9c9a0;padding-top:10px}
#kebunSawit .ks-price b{font-size:22px;color:#c25a00;display:flex;align-items:center;gap:6px}
#kebunSawit .ks-msg{min-height:18px;font-size:13px;font-weight:700;color:#b3261e}
#kebunSawit .ks-card .ks-btn{max-width:none}
#kebunSawit [hidden]{display:none!important}
</style>
<style>html,body{margin:0;height:100%;background:#8fd3f4}[hidden]{display:none!important}</style></head><body>


<div id="kebunSawit" hidden>
  <canvas id="ksCv"></canvas>
  <div class="ks-col">
    <div class="ks-top">
      <div class="ks-pill" id="ksCoinPill"><i class="ks-coin"></i><span id="ksCoins">0</span></div>
      <div class="ks-right">
        <button class="ks-ib" id="ksSnd" type="button" aria-label="Suara"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="ksSndW" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
        <button class="ks-ib" id="ksX" type="button" aria-label="Keluar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="ks-title" id="ksTitle">Kebun Sawit</div>
    <div class="ks-bot" id="ksBot">
      <div class="ks-hint" id="ksHint"></div>
      <button class="ks-btn" id="ksHarvest" type="button">PANEN SEMUA</button>
    </div>
    <div class="ks-buy" id="ksBuy" hidden>
      <div class="ks-card">
        <h2>Kebun Sawit Pribadi</h2>
        <ul>
          <li>20 pohon sawit milikmu sendiri, tanpa rebutan petak.</li>
          <li>Tumbuh terus walau kamu tidak main.</li>
          <li>Panen diangkut truk, koin masuk ke dompetmu.</li>
          <li>Siram pohon untuk mempercepat tumbuh.</li>
        </ul>
        <div class="ks-price"><span>Harga sekali beli</span><b><i class="ks-coin"></i><span id="ksPrice">950</span></b></div>
        <div class="ks-msg" id="ksMsg"></div>
        <button class="ks-btn" id="ksBuyBtn" type="button">BELI KEBUN</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   KEBUN SAWIT NUSA - kebun pribadi per pemain, satu file, canvas 2D isometrik.
   Pasang di game lain:
     window.KEBUN_EMBED = true;                 // sebelum skrip ini; tidak auto-buka, tombol X aktif
     window.KEBUN_HOST  = {...}                 // ganti adapter lokal (lihat bagian ADAPTER di bawah)
     KebunSawit.buka({readOnly:false, nama:''}) // readOnly:true = mengunjungi kebun warga (hanya lihat)
     KebunSawit.tutup()
   Semua uang dan waktu tumbuh HARUS diputuskan server/Firebase pada versi nyata.
   Animasi hanya tampilan.
   ===================================================================== */
(function(){
'use strict';
var EMBED=window.KEBUN_EMBED===true||new URLSearchParams(location.search).get('embed')==='1';
var COST=950;                 // harga kebun (koin)
var COLS=4,ROWS=5,N=COLS*ROWS;// 20 pohon
var GROW_MS=300000;           // 5 menit, divalidasi lagi oleh game utama
var COIN_PER=18;              // koin per pohon sekali panen
var WATER_MS=4000;            // sekali siram memajukan waktu tumbuh
var WATER_CD=9000;            // jeda siram per pohon

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function $(id){return document.getElementById(id)}
var root=$('kebunSawit'),cv=$('ksCv'),ctx=cv.getContext('2d');
var PI2=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,PI2)}

/* ================= ADAPTER LOKAL (GPT: ganti bagian ini dengan Firebase) =================
   Kontrak: semua fungsi mengembalikan Promise.
   getState()  -> {koin, punya, palms:[{plantedAt}] (20 item, ms epoch SERVER), nama}
   beli()      -> {ok, msg, state}        server: cek koin, kurangi, buat kebun, cegah beli dua kali
   panen(ids)  -> {ok, msg, koin, ids, state}  server: hanya pohon yang benar-benar matang, tambah koin, reset plantedAt
   siram(id)   -> {ok, state}             server: majukan plantedAt, batasi jeda
*/
var LOCAL=(function(){
  var S=null;
  function load(){try{S=JSON.parse(ls('ks_state'))}catch(e){S=null}
    if(!S||typeof S.koin!=='number')S={koin:1500,punya:false,palms:[],nama:'Kebunku'};
    return S}
  function save(){ls('ks_state',JSON.stringify(S))}
  function snap(){return JSON.parse(JSON.stringify(S))}
  load();
  return{
    getState:function(){load();return Promise.resolve(snap())},
    beli:function(){load();
      if(S.punya)return Promise.resolve({ok:false,msg:'Kamu sudah punya kebun.',state:snap()});
      if(S.koin<COST)return Promise.resolve({ok:false,msg:'Koin belum cukup. Kurang '+fmt(COST-S.koin)+' koin.',state:snap()});
      S.koin-=COST;S.punya=true;S.palms=[];var now=Date.now();
      for(var i=0;i<N;i++)S.palms.push({plantedAt:now-Math.random()*GROW_MS*.9,wAt:0});
      save();return Promise.resolve({ok:true,state:snap()})},
    panen:function(ids){load();var now=Date.now(),ok=[],i;
      for(i=0;i<ids.length;i++){var p=S.palms[ids[i]];if(p&&now-p.plantedAt>=GROW_MS){ok.push(ids[i]);p.plantedAt=now}}
      var c=ok.length*COIN_PER;S.koin+=c;save();
      return Promise.resolve({ok:ok.length>0,koin:c,ids:ok,state:snap()})},
    dbgReady:function(n){load();for(var i=0;i<n&&i<S.palms.length;i++)S.palms[i].plantedAt=Date.now()-GROW_MS-10;save();return snap()},
    siram:function(id){load();var p=S.palms[id],now=Date.now();
      if(!p||now-p.plantedAt>=GROW_MS||now-(p.wAt||0)<WATER_CD)return Promise.resolve({ok:false,state:snap()});
      p.plantedAt-=WATER_MS;p.wAt=now;save();return Promise.resolve({ok:true,state:snap()})}
  };
})();
var RPC=(function(){
  var seq=0,pending={};
  window.addEventListener('message',function(e){var d=e.data||{};if(d.type!=='kebunsawit:response'||!pending[d.id])return;var p=pending[d.id];delete pending[d.id];d.error?p.reject(new Error(d.error)):p.resolve(d.result)});
  function call(op,payload){return new Promise(function(resolve,reject){var id='ks-'+Date.now()+'-'+(++seq);pending[id]={resolve:resolve,reject:reject};parent.postMessage({type:'kebunsawit:request',id:id,op:op,payload:payload||{}},'*');setTimeout(function(){if(!pending[id])return;delete pending[id];reject(new Error('Koneksi kebun terlalu lama.'))},12000)})}
  return{getState:function(){return call('state')},beli:function(){return call('buy')},panen:function(ids){return call('harvest',{ids:ids})},siram:function(id){return call('water',{id:id})}};
})();
var HOST=window.KEBUN_HOST||(EMBED?RPC:LOCAL);
/* ================= AKHIR ADAPTER ================= */

/* ---------- suara ---------- */
var AC=null,master=null,noiseBuf=null,muted=ls('ks_mute')==='1';
var comboAudio=new Audio('panen-kombo.mp3');comboAudio.preload='auto';comboAudio.volume=.82;
function comboVoice(){if(muted)return;try{comboAudio.currentTime=0;var p=comboAudio.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    var n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,slide,when){if(!AC||muted)return;var t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.1,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f0,f1,when){if(!AC||muted||!noiseBuf)return;var t=AC.currentTime+(when||0),s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(60,f1||f0),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02)}
var sfx={
  pop:function(i){tone(420+(i%8)*60,.1,'triangle',.1)},
  water:function(){noise(.25,.2,3000,1200)},
  crate:function(){tone(180,.08,'square',.1,90);noise(.06,.12,900,400)},
  coin:function(i){tone(1200+i*60,.07,'square',.06);tone(1700+i*60,.12,'square',.06,0,.05)},
  engine:function(){tone(70+Math.random()*10,.16,'sawtooth',.07,55)},
  horn:function(){tone(330,.28,'square',.08);tone(415,.28,'square',.07)},
  ready:function(){tone(880,.1,'triangle',.08);tone(1320,.14,'triangle',.08,0,.08)},
  buy:function(){for(var i=0;i<5;i++)tone(440*Math.pow(2,[0,4,7,12,16][i]/12),.14,'square',.1,0,i*.07)},
  no:function(){tone(200,.15,'sawtooth',.08,120)}
};
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- ukuran & isometrik ---------- */
var VW=0,VH=0,W=0,OX=0,DPR=1,S=1,ox=0,oy=0,safeTop=0,TW=64,TH=32;
function resize(){
  var w=window.innerWidth,h=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';
  VW=w;VH=h;W=Math.min(w,520);OX=(w-W)/2;
  S=clamp(Math.min((W-12)/430,(VH-250)/330),.5,1.5);
  ox=W/2-.3*(TW/2)*S;oy=VH*.47-5.2*(TH/2)*S;
}
function isoX(gx,gy){return ox+(gx-gy)*(TW/2)*S}
function isoY(gx,gy,z){return oy+(ST.punya?0:-VH*.1)+(gx+gy)*(TH/2)*S-(z||0)*S}
function poly(pts,fill,stroke){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
// kotak isometrik; z dalam piksel dunia (dikali S)
function isoBox(x0,y0,x1,y1,zb,zt,cTop,cR,cL){
  var a=function(x,y,z){return [isoX(x,y),isoY(x,y,z)]};
  var p,q,r,t;
  if(cR){p=a(x1,y0,zb);q=a(x1,y1,zb);r=a(x1,y1,zt);t=a(x1,y0,zt);poly([p[0],p[1],q[0],q[1],r[0],r[1],t[0],t[1]],cR)}
  if(cL){p=a(x0,y1,zb);q=a(x1,y1,zb);r=a(x1,y1,zt);t=a(x0,y1,zt);poly([p[0],p[1],q[0],q[1],r[0],r[1],t[0],t[1]],cL)}
  if(cTop){p=a(x0,y0,zt);q=a(x1,y0,zt);r=a(x1,y1,zt);t=a(x0,y1,zt);poly([p[0],p[1],q[0],q[1],r[0],r[1],t[0],t[1]],cTop)}
}

/* ---------- keadaan ---------- */
var ST={koin:0,punya:false,palms:[],nama:'Kebunku'};
var V={palms:[],show:0,readOnly:false,time:0,tip:null,tipT:0,shake:0};
var truck={mode:'off',ty:-3,speed:0,crates:0,load:0,pending:[],busy:false,alpha:0,hornDone:false,reward:0,comboAll:false};
var flights=[],parts=[],floats=[],clouds=[];
for(var ci=0;ci<4;ci++)clouds.push({x:Math.random(),y:.08+Math.random()*.25,s:.6+Math.random()*.8,v:.004+Math.random()*.006});
function syncState(s,keepAnim){
  ST=s;ST.palms=s.palms||[];
  for(var i=0;i<N;i++){var p=ST.palms[i];var v=V.palms[i]||(V.palms[i]={pop:0,hold:false,shownAt:0,sway:Math.random()*6,readyFlag:false});
    v.has=!!p;if(!p){v.pop=0}}
  renderHUD();
}
function prog(i){var p=ST.palms[i];if(!p)return 0;var v=V.palms[i];if(v&&v.hold)return 1;return clamp((Date.now()-p.plantedAt)/GROW_MS,0,1)}
function readyList(){var r=[];for(var i=0;i<N;i++)if(ST.palms[i]&&prog(i)>=1&&!V.palms[i].hold)r.push(i);return r}
function renderHUD(){
  $('ksCoins').textContent=fmt(shownCoins);
  $('ksTitle').textContent=V.readOnly?(ST.nama||'Kebun Warga'):(ST.nama||'Kebun Sawit');
  $('ksBuy').hidden=ST.punya||V.readOnly;
  $('ksPrice').textContent=fmt(COST);
  $('ksBot').hidden=!ST.punya||V.readOnly;
}
var shownCoins=0;
function updateBottom(){
  if(!ST.punya)return;
  var r=readyList(),b=$('ksHarvest'),hint=$('ksHint');
  if(truck.busy){b.disabled=true;b.textContent='TRUK BEKERJA...';hint.textContent='Panen sedang diangkut'}
  else if(r.length){b.disabled=false;b.textContent='PANEN SEMUA ('+r.length+')';hint.textContent='Ketuk pohon matang atau tombol di bawah'}
  else{b.disabled=true;var m=1e18;for(var i=0;i<N;i++){var p=ST.palms[i];if(p)m=Math.min(m,GROW_MS-(Date.now()-p.plantedAt))}
    var s=Math.max(0,Math.ceil(m/1000));b.textContent='MATANG DALAM '+(s>=3600?Math.floor(s/3600)+':':'')+Math.floor(s%3600/60)+':'+('0'+s%60).slice(-2);hint.textContent='Ketuk pohon yang sedang tumbuh untuk menyiram'}
}

/* ---------- partikel ---------- */
function part(x,y,vx,vy,l,s,c,k,g){if(parts.length>260)parts.shift();parts.push({x:x,y:y,vx:vx,vy:vy,l:l,m:l,s:s,c:c,k:k,g:g||0,r:Math.random()*6})}
function burst(x,y,n,cols,sp,k,l,g){for(var i=0;i<n;i++){var a=Math.random()*PI2,s=sp*(.3+Math.random()*.7);part(x,y,Math.cos(a)*s,Math.sin(a)*s,l||.6,3+Math.random()*3,cols[Math.floor(Math.random()*cols.length)],k||0,g)}}
function ft(t,x,y,c,s){if(floats.length>20)floats.shift();floats.push({t:t,x:clamp(x,60,W-60),y:y,c:c||'#fff',l:1.1,m:1.1,s:s||22})}

/* ---------- gambar pohon sawit ---------- */
function drawPalm(bx,by,p,ready,sway,pop,t){
  var sc=S*(pop<1?(0.2+0.8*pop+Math.sin(pop*Math.PI)*.25):1);
  var H=lerp(7,44,Math.min(1,p))*sc,tw=lerp(2.5,5.2,Math.min(1,p))*sc,w=Math.sin(t*1.4+sway)*1.6*sc;
  var cx=bx+w,cy=by-H;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(bx+3*sc,by+2*sc,lerp(9,22,p)*sc,lerp(4,9,p)*sc,0,0,PI2);ctx.fill();
  // batang
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.moveTo(bx-tw,by);ctx.quadraticCurveTo(bx-tw*.6+w*.2,by-H*.5,cx-tw*.55,cy);ctx.lineTo(cx+tw*.55,cy);ctx.quadraticCurveTo(bx+tw*.6+w*.2,by-H*.5,bx+tw,by);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(40,22,8,.35)';ctx.lineWidth=Math.max(1,sc*.9);
  var rings=Math.floor(3+p*6);for(var i=1;i<=rings;i++){var f=i/(rings+1),yy=by-H*f,xx=lerp(bx,cx,f*f),ww=lerp(tw,tw*.55,f);ctx.beginPath();ctx.moveTo(xx-ww,yy);ctx.lineTo(xx+ww,yy+ww*.35);ctx.stroke()}
  // tandan buah
  if(ready){var pul=.5+.5*Math.sin(t*5);
    for(var k=0;k<3;k++){var a=k*2.1+.6,bxp=cx+Math.cos(a)*tw*2.1,byp=cy+4*sc+Math.sin(a)*tw*.8;
      ctx.fillStyle='#d8431a';circ(bxp,byp+3*sc,5.2*sc);ctx.fill();ctx.fillStyle='#ff8a2a';circ(bxp-1*sc,byp+1.5*sc,3.2*sc);ctx.fill();ctx.fillStyle='#ffc866';circ(bxp-1.6*sc,byp,1.4*sc);ctx.fill()}
  }
  // pelepah
  var n=Math.floor(3+p*6),len=lerp(9,27,p)*sc;
  for(i=0;i<n;i++){var ang=i/n*PI2+.35+Math.sin(t*1.2+sway+i)*.05;
    var tx=cx+Math.cos(ang)*len,ty=cy+Math.sin(ang)*len*.42+len*.34;

/* ---------- logika animasi panen ---------- */
function startHarvest(ids,comboAll){
  if(truck.busy||!ids.length)return;truck.busy=true;truck.mode='in';truck.crates=0;truck.alpha=0;truck.ty=-2.6;truck.speed=7;truck.hornDone=false;truck.pending=ids.slice();truck.reward=0;truck.stopTy=null;truck.load=0;truck.res=undefined;truck.ids=null;
  truck.comboAll=!!comboAll;
  ids.forEach(function(i){V.palms[i].hold=true});
  var avg=0;ids.forEach(function(i){avg+=Math.floor(i/COLS)+.5});avg/=ids.length;truck.stopTy=clamp(avg-BEDLEN*.6,0,5-BEDLEN-.4);
  HOST.panen(ids).then(function(res){
    if(!res.ok){abort(ids,res);return}
    truck.reward=res.koin;truck.res=res;truck.ids=res.ids;
    ids.forEach(function(i){if(res.ids.indexOf(i)<0)V.palms[i].hold=false});
    // sinkron data server tanpa menghapus tampilan matang yang sedang diangkut
    pendingState=res.state;
  }).catch(function(){abort(ids,{msg:'Gagal terhubung.'})});
}

}
function updateTruck(dt){
  if(truck.mode==='off')return;
  var stop=truck.stopTy==null?1.5:truck.stopTy;
  if(truck.mode==='in'){
    truck.alpha=clamp((truck.ty+1.2)/1.4,0,1);
    var dist=stop-truck.ty;truck.speed=clamp(dist*2.2,.6,6.5);truck.ty+=truck.speed*dt;
    if(Math.random()<dt*7){sfx.engine();part(isoX(TRX0+.2,truck.ty-.05),isoY(TRX0+.2,truck.ty-.05,10),(Math.random()-.5)*10,10+Math.random()*10,.6,5,'rgba(220,220,220,.7)',0,-20)}
    if(dist<.04&&truck.ids){truck.ty=stop;truck.speed=0;truck.mode='load';launchCrates();if(!truck.hornDone){truck.hornDone=true;sfx.horn()}}
    if(dist<.04&&!truck.ids&&truck.res===undefined){/* menunggu server */ truck.ty=stop;truck.speed=0}
  }else if(truck.mode==='load'){
    var n=truck.total,el=V.time-truck.loadStart;

      var id=truck.ids[truck.launched],v=V.palms[id],pos=palmPos(id);
      flights.push({from:{x:v.cx!=null?v.cx:pos.x,y:v.cy!=null?v.cy:pos.y},id:id,t:0,slot:truck.launched});
      if(pendingState&&pendingState.palms[id])ST.palms[id].plantedAt=pendingState.palms[id].plantedAt;
      v.hold=false;truck.launched++;sfx.pop(truck.launched)
    }
    if(truck.landed>=n){truck.mode='pay';truck.payT=0;
      var bp={x:isoX(TRX0+.4,truck.ty+.6),y:isoY(TRX0+.4,truck.ty+.6,50)};
      ft('+'+truck.reward+' koin',bp.x,bp.y-10,'#ffd23f',30);for(var i=0;i<12;i++)part(bp.x,bp.y,(Math.random()-.5)*200,-80-Math.random()*160,1,6,'#ffd23f',3,420);sfx.coin(0);vib(30);
      animateCoins(ST.koin,pendingState?pendingState.koin:ST.koin+truck.reward)}
  }else if(truck.mode==='pay'){
    truck.payT+=dt;if(truck.payT>.9){truck.mode='out'}
  }else if(truck.mode==='out'){
    truck.speed=Math.min(8,truck.speed+dt*8);truck.ty+=truck.speed*dt;
    if(Math.random()<dt*8)sfx.engine();
    if(truck.ty>5.4)truck.alpha=clamp((6.6-truck.ty)/1.2,0,1);

  }
}

    var d1=Math.hypot(x-v.cx,y-(v.cy+8*S)),d2=Math.hypot(x-v.bx,y-v.by);
    var d=Math.min(d1*.8,d2),r=30*S;if(d<r&&d<bd){bd=d;best=i}}
  return best;
}
function onTap(e){
  if(root.hidden||!ST.punya||V.readOnly)return;
  if(e.target&&e.target.closest&&e.target.closest('.ks-ib,.ks-btn,.ks-pill,.ks-card'))return;
  var x=e.clientX-OX,y=e.clientY,i=pickPalm(x,y);if(i<0)return;ac();
  var v=V.palms[i],pr=prog(i),p=ST.palms[i];
  if(pr>=1){if(!truck.busy)startHarvest([i]);return}
  var left=Math.max(0,Math.ceil((GROW_MS-(Date.now()-p.plantedAt))/1000));
  var cd=Date.now()-(p.wAt||0)<WATER_CD;
  V.tip={t:'Tumbuh '+Math.floor(pr*100)+'% · '+Math.floor(left/60)+':'+('0'+left%60).slice(-2),x:v.cx,y:v.cy-26*S};V.tipT=1.6;
  if(cd){sfx.no();return}
  HOST.siram(i).then(function(r){if(!r.ok){sfx.no();return}
    sfx.water();vib(10);for(var k=0;k<12;k++)part(v.cx+(Math.random()-.5)*26*S,v.cy-10*S,(Math.random()-.5)*40,60+Math.random()*80,.6,4,'#5ac8fa',2,300);
    ft('Disiram!',v.cx,v.cy-34*S,'#bfe6f5',16);
    if(r.state.palms[i]&&ST.palms[i]){ST.palms[i].plantedAt=r.state.palms[i].plantedAt;ST.palms[i].wAt=r.state.palms[i].wAt}});
}

window.addEventListener('resize',function(){if(!root.hidden)resize()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)last=performance.now()});

/* ---------- loop ---------- */
var last=0,raf=0,running=false;
function frame(t){if(!running)return;raf=requestAnimationFrame(frame);var dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw()}
function startLoop(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame)}
function stopLoop(){running=false;cancelAnimationFrame(raf)}

/* ---------- API ---------- */
var api={
  buka:function(o){o=o||{};V.readOnly=!!o.readOnly;root.hidden=false;resize();
    HOST.getState(o.uid).then(function(s){if(o.nama)s.nama=o.nama;shownCoins=s.koin;syncState(s);
      for(var i=0;i<N;i++){var v=V.palms[i];v.pop=v.has?0:1;v.popAt=V.time+i*.05}
      if(!ST.punya)for(i=0;i<N;i++){V.palms[i].has=false}
      renderHUD();updateBottom();});
    startLoop();try{document.body.style.overflow='hidden'}catch(e){}},
  tutup:function(){stopLoop();root.hidden=true;try{document.body.style.overflow=''}catch(e){}try{if(EMBED)parent.postMessage({type:'kebunsawit:keluar'},'*');else window.dispatchEvent(new CustomEvent('kebunsawit:keluar'))}catch(e){}},
  _t:{ST:function(){return ST},V:V,truck:truck,setReady:function(n){var s=LOCAL.dbgReady(n);for(var i=0;i<N;i++){if(ST.palms[i]&&s.palms[i])ST.palms[i].plantedAt=s.palms[i].plantedAt}},prog:prog,N:N,flights:flights}
};
window.KebunSawit=api;
if(!EMBED)api.buka();
})();
