                w.events = w.events.slice(0, 15);

            }
            if (action === 'tutorial') {
                p.tutorial = amount(b.step, 0, 4);
                return {};
            }
            throw new Error('Tindakan tidak dikenal.');
        });
        if (loc) {
            const p = out.world.players[uid];
            await db().prepare('INSERT INTO presence (id,x,z,yaw,emote,updated) VALUES (?,?,?,?,?,?) ON CONFLICT(id) DO UPDATE SET x=excluded.x,z=excluded.z,yaw=excluded.yaw,emote=excluded.emote,updated=excluded.updated').bind(p.id, loc.x, loc.z, loc.yaw, loc.emote, now).run();
        }
        return json({ ...view(out.world, uid), ...out.result });
    }
    catch (e) {
        return error(e);
    }

async function act(action,body={},quiet=false){if(mutating&&action!=='heartbeat')throw Error('Tunggu proses sebelumnya selesai.');if(state.me?.banned&&action!=='heartbeat')throw Error(state.me.expelled?'Anda diusir dari Kota Nusa.':'Akses kota sedang ditangguhkan.');if(action!=='heartbeat')mutating=true;try{const data=await request('/api/game',{action,...body});absorb(data);if(data.message&&!quiet){toast(data.message);beep('good');}connected=true;$('#offline')?.classList.add('hidden');return data;}catch(e){if(!quiet){toast(e.message,true);beep('bad');}throw e;}finally{if(action!=='heartbeat')mutating=false;}}
async function poll(){if(polling||document.hidden||mutating)return;polling=true;try{absorb(await request('/api/state'));connected=true;$('#offline')?.classList.add('hidden');if(entered&&state.me)await act('heartbeat',world.position(),true);if(chatOpen)loadChat();}catch(e){if(!e.login){connected=false;$('#offline')?.classList.remove('hidden');}}finally{polling=false;}}
const badge=(r)=>r==='citizen'?'':`<span class="member-badge">${esc(roleName(r))}</span>`;
function updateHud(){if(!state.me)return;const p=state.me;$('#hudName').textContent=p.name;$('#hudRole').textContent=roleName(p.role)+' · '+(p.career?.name??'Warga Baru');if($('#xpLabel'))$('#xpLabel').textContent=fmt(p.xp)+' EXP';$('#coins').textContent=fmt(p.coins-p.held);$('#onlineCount').textContent='Mode offline';$('#ownerNav').classList.toggle('hidden',!['president','vice'].includes(p.role));$('#ownerNav span').textContent=p.role==='president'?'Presiden':p.role==='vice'?'Wakil':'Pemerintah';const access=$('#governmentAccess');if(access){access.classList.toggle('hidden',!['president','vice'].includes(p.role));access.classList.toggle('official',p.role==='president'||p.role==='vice');access.querySelector('span').textContent=officeLabel(p.role);}const cityBtn=$('#cityOfficeNav');if(cityBtn)cityBtn.classList.toggle('hidden',p.role!=='mayor');$('#cityClock').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}).replace('.',':')+' WIB';}
function closePanel(){if(state.me?.banned){showCityBan(state.me);return;}if(workStop){workStop();workStop=null;}miniActive=false;$('#modal').classList.add('hidden');$('#modal').innerHTML='';currentPanel='';world?.pause(false);}
function panel(title,html,{sub='KOTA NUSA',narrow=false,work=false,foot=''}={}){if(workStop){workStop();workStop=null;}miniActive=false;currentPanel=title;world?.pause(true);world?.stop();const m=$('#modal');m.classList.remove('hidden');m.innerHTML=`<section class="panel ${narrow?'narrow':''} ${work?'work-panel':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="panel-head"><div><div class="eyebrow">${sub}</div><h2>${title}</h2></div><button class="icon-close" data-close aria-label="Tutup">${icon('close')}</button></header><div class="panel-body">${html}</div>${foot?`<footer class="panel-foot">${foot}</footer>`:''}</section>`;m.querySelector('[data-close]').onclick=closePanel;requestAnimationFrame(()=>m.querySelector('button')?.focus({preventScroll:true}));}
function confirmBox(title,body,callback,label='Konfirmasi'){panel(title,`<div class="confirmation">${body}</div><div class="row"><button class="btn grow" id="confirmCancel">Kembali</button><button class="btn primary grow" id="confirmDo">${label}</button></div>`,{narrow:true,sub:'PERIKSA SEBELUM MELANJUTKAN'});$('#confirmCancel').onclick=closePanel;$('#confirmDo').onclick=async()=>{const b=$('#confirmDo');b.disabled=true;try{await callback();}catch{}finally{if(b.isConnected)b.disabled=false;}};}
function onboarding(){if(state.me)return enter();panel('Selamat datang, tetangga.',`<p class="intro">Buat identitas warga. Kos Pelangi dan 250 koin menunggu kedatanganmu.</p><div class="avatar-preview" id="avatarPreview">${icon('person')}</div><label class="field"><span>Nama warga</span><input class="input" id="registerName" maxlength="20" placeholder="Contoh: Senja, Raka, atau Hanz" autocomplete="nickname"></label><span class="label">Warna pakaian</span><div class="avatar-colors">${['#579b8b','#c18e73','#839bb5','#ae97b7','#b7a26e','#80996e'].map(c=>`<button class="color-btn ${c===selectedColor?'active':''}" data-color="${c}" style="background:${c}" aria-label="Warna ${c}"></button>`).join('')}</div><div class="notice">Data tersimpan di browser HP ini. Cadangkan progres sebelum menghapus data browser.</div><p class="form-error" id="registerError"></p><button class="btn primary wide" id="registerBtn">${icon('plane')} Buat kartu warga</button>`,{narrow:true,sub:'PENDAFTARAN WARGA'});$$('[data-color]').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;$$('[data-color]').forEach(x=>x.classList.toggle('active',x===b));$('#avatarPreview svg').style.color=selectedColor;});$('#registerBtn').onclick=async()=>{const b=$('#registerBtn');b.disabled=true;try{await act('register',{name:$('#registerName').value,color:selectedColor});enter();setTimeout(showGuide,800);}catch(e){if(e.login)location.href='/signin-with-chatgpt?return_to=%2F';else $('#registerError').textContent=e.message;}finally{if(b.isConnected)b.disabled=false;}};}
function enter(){if(state.me?.banned)return showCityBan(state.me);entered=true;closePanel();$('#landing').classList.add('hidden');$('#hud').classList.remove('hidden');world.enter(state.me.color);updateHud();world.sync(state.online,state.citizens,state.me.id,state.city.projects);music();poll();}
const visitMemory=new Set();
function visitKey(url){return 'nusa-visit:'+url;}
function hasVisited(url){try{return localStorage.getItem(visitKey(url))==='1'||visitMemory.has(url);}catch{return visitMemory.has(url);}}
function markVisited(url){visitMemory.add(url);try{localStorage.setItem(visitKey(url),'1');}catch{}}
function join(){if(loading)return;loading=true;request('/api/state').then(d=>{absorb(d);airportGate();}).catch(e=>{if(e.login)location.href='/signin-with-chatgpt?return_to=%2F';else toast(e.message,true);}).finally(()=>loading=false);}
function showCareer(){const c=state.me.career;const ranks=[['Warga Baru',0,0],['Magang',150,2],['Terampil',500,4],['Profesional',1300,6],['Supervisor',3000,8],['Kepala Divisi',6500,10]];panel('Tumbuh lewat karya',`<div class="career-hero"><div class="eyebrow">PANGKAT KARIER SAAT INI</div><h3>${esc(c.name)}</h3><strong>${fmt(state.me.xp)} EXP</strong><p>${c.next?fmt(c.next.xp-state.me.xp)+' EXP lagi menuju '+esc(c.next.name):'Puncak jenjang karier telah tercapai.'}</p><div class="vote-progress"><i style="width:${c.next?Math.min(100,(state.me.xp-c.xp)/(c.next.xp-c.xp)*100):100}%"></i></div></div><p class="intro" style="margin-top:18px">Setiap giliran yang selesai memberi 5–12 EXP sesuai kualitas. EXP baru diberikan saat mengambil upah, jadi membatalkan tugas tidak menghasilkan EXP.</p>${ranks.map(([name,xp,bonus],i)=>`<div class="rank-row ${state.me.xp>=xp?'unlocked':''}"><div class="rank-number">${state.me.xp>=xp?icon('check'):i+1}</div><div class="grow"><h3>${name}</h3><p>${fmt(xp)} EXP · bonus upah ${bonus}%</p></div><span class="tag">${c.index===i?'Saat ini':state.me.xp>=xp?'Tercapai':'Terkunci'}</span></div>`).join('')}<div class="notice">Perkiraan Magang: sekitar 13–30 giliran tuntas. Pangkat karier tidak memberi akses admin, tidak mengganti Presiden/Wakil, dan direset jika karakter meninggal.</div><button class="btn primary wide" data-nav="jobs">Cari pekerjaan ${icon('arrow')}</button>`,{narrow:true,sub:'JENJANG KARIER · SETIAP TUGAS BERARTI'});}
function showJobs(filter='Semua'){const s=state.me?.job;panel('Temukan pekerjaanmu',`<p class="intro">${catalog.jobs.length} profesi di bangunan yang sesuai. Pilih tempat kerja, lalu jalankan minigamenya. Selesaikan satu babak atau lebih. Ambil upah kapan saja di antara babak.</p>${s?`<div class="notice row spread"><div><b>Giliran aktif · ${esc(catalog.jobs.find(j=>j.id===s.id)?.name)}</b><br>${s.rounds} putaran tersimpan</div><button class="btn small primary" id="resumeJob">Lanjut kerja</button></div>`:''}<div class="row spread" style="margin-bottom:15px"><span class="tag">${esc(state.me?.career?.name??'Warga Baru')} · ${fmt(state.me?.xp)} EXP</span><button class="btn small" data-nav="career">Jenjang karier ${icon('arrow')}</button></div><div class="chips">${['Semua','Santai','Berisiko','Penerbangan','Kuliner','Alam','Teknik','Layanan','Kreatif','Transportasi','Penyelamatan'].map(f=>`<button class="chip ${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="cards">${catalog.jobs.filter(j=>filter==='Semua'||filter==='Santai'&&j.risk<=1||filter==='Berisiko'&&j.risk>=3||j.group===filter).map(j=>`<article class="card"><div class="job-art" style="background:${j.color}">${icon(j.icon)}</div><h3>${j.name}</h3><p class="job-location">${esc(catalog.places.find(p=>p.id===j.workplace)?.name)}</p><p>${j.desc}</p><div class="card-meta"><b>${Math.round(j.pay*.6/5)}–${Math.round(j.pay/5)} koin/babak</b><span class="tag ${j.risk>=4?'red':j.risk>=2?'risk':''}">${['Aman','Rendah','Sedang','Tinggi','Sangat tinggi','Ekstrem'][j.risk]}</span></div><button class="btn wide" data-job="${j.id}">${j.risk>=3&&state.me?.jobs<2?icon('lock'):'Datangi tempat kerja'} ${j.risk>=3&&state.me?.jobs<2?'Perlu 2 tugas':icon('arrow')}</button></article>`).join('')}</div>`,{sub:'BURSA KARYA · PILIH CARA BERKARYAMU',foot:`<span>Pajak saat ini ${state.city.tax}% · Gratis pajak 1 jam aktif pertama.</span><button class="btn small" data-nav="wallet">Dompet ${icon('arrow')}</button>`});$$('[data-filter]').forEach(b=>b.onclick=()=>showJobs(b.dataset.filter));$$('[data-job]').forEach(b=>b.onclick=()=>showWorkplace(catalog.jobs.find(j=>j.id===b.dataset.job).workplace));if($('#resumeJob'))$('#resumeJob').onclick=startRound;}

function showWorkplace(id){
 if(!state.me)return join();const site=catalog.places.find(p=>p.id===id);if(!site)return showJobs();
 world.navigate(site.x,site.z);const jobs=catalog.jobs.filter(j=>j.workplace===id);
 panel(site.name,`<div class="workplace-hero" style="--venue-color:${jobs[0]?.color||'#8bad90'}"><div>${icon(jobs[0]?.icon||'work')}</div><span>TEMPAT KERJA</span><h3>${esc(site.name)}</h3><p>${esc(site.sub)}</p></div><div class="row wrap venue-actions"><button class="btn small" id="venueOnMap">${icon('map')} Lihat bangunan</button>${id==='market'?'<button class="btn small" data-nav="market">Belanja</button>':''}${id==='cafe'?'<button class="btn small" id="venueChat">Meja ngobrol</button>':''}${id==='airport'?'<button class="btn small" id="venueBoard">Papan kedatangan</button>':''}${id==='clinic'?'<button class="btn small" data-nav="clinic">Layanan klinik</button>':''}</div><h3 class="section-title">Pekerjaan di sini</h3><div class="cards">${jobs.map(j=>`<article class="card"><div class="job-art" style="background:${j.color}">${icon(j.icon)}</div><h3>${j.name}</h3><p>${j.desc}</p><div class="card-meta"><b>${Math.round(j.pay*.6/5)}–${Math.round(j.pay/5)} koin/babak</b><span class="tag ${j.risk>=3?'risk':''}">${['Aman','Rendah','Sedang','Tinggi','Sangat tinggi','Ekstrem'][j.risk]}</span></div><button class="btn primary wide" data-venue-job="${j.id}">Lihat giliran ${icon('arrow')}</button></article>`).join('')}</div>`,{sub:'BEKERJA SESUAI LOKASI'});
 $('#venueOnMap').onclick=closePanel;if($('#venueBoard'))$('#venueBoard').onclick=airportBoard;$$('[data-venue-job]').forEach(b=>b.onclick=()=>jobInfo(b.dataset.venueJob));
 if($('#venueChat'))$('#venueChat').onclick=async()=>{try{await act('heartbeat',world.position(),true);closePanel();openChat('table:1');}catch(e){toast(e.message,true);}};
}

function jobInfo(id){if(!state.me)return join();const j=catalog.jobs.find(j=>j.id===id),site=catalog.places.find(p=>p.id===j.workplace);world.navigate(site.x,site.z);panel(j.name,`<div class="job-art" style="height:100px;background:${j.color}">${icon(j.icon)}</div><p class="intro" style="margin-top:17px">${j.desc}</p><div class="stats-grid"><div class="stat-box"><span>Maks. per babak</span><strong>${Math.round(j.pay/5)}</strong></div><div class="stat-box"><span>Durasi babak</span><strong>±30 dtk</strong></div><div class="stat-box"><span>Jumlah babak</span><strong>Bebas</strong></div></div>${j.risk>=2?`<div class="notice ${j.risk>=3?'warn':''}">Putaran gagal dapat mengurangi kesehatan. Jika kesehatan mencapai nol, karakter memulai ulang: rumah, uang, barang, dan keterampilan direset. Akun, teman, dan hak Owner tetap ada.</div>`:'<div class="notice">Profesi ini cocok untuk memulai. Gagal tugas tidak menyebabkan kematian.</div>'}${j.risk>=3?'<label class="check"><input type="checkbox" id="riskAck"><span>Saya memahami risiko karakter dan siap mengikuti misi. Perlengkapan keselamatan termasuk dalam tugas.</span></label>':''}<div class="row"><button class="btn grow" id="jobBack">Kembali</button><button class="btn primary grow" id="jobStart">Mulai bekerja</button></div>`,{narrow:true,sub:site.name.toUpperCase()});$('#jobBack').onclick=()=>showWorkplace(j.workplace);$('#jobStart').onclick=async()=>{const b=$('#jobStart');b.disabled=true;try{await act('startJob',{job:id,workplace:j.workplace,ack:$('#riskAck')?.checked||false});startRound();}catch{}finally{if(b.isConnected)b.disabled=false;}};}
function startRound(){const session=state.me?.job;if(!session)return showJobs();const j=catalog.jobs.find(j=>j.id===session.id);
 panel(j.name,`<div class="work-status"><span>BABAK TUNTAS<strong id="workCount">${session.rounds}</strong></span><span>UPAH KOTOR<strong id="workPay">${fmt(session.payout||0)}</strong></span><span>KONDISI<strong>${Math.round(state.me.health)}%</strong></span></div><div id="miniHost"></div><div class="row spread" style="margin-top:14px"><button class="btn small" id="cancelWork">Batalkan</button><button class="btn primary" id="finishWork" disabled>Selesai & ambil upah</button></div><p class="intro">Selesaikan satu babak, lalu pilih berhenti atau lanjut. Babak yang belum selesai tidak dibayar. Pajak dipotong saat mengambil upah.</p>`,{work:true,sub:'KERJA SESUAI JUMLAH BABAK'});
 const stop=()=>{if(workStop){workStop();workStop=null}miniActive=false};
 const finish=async()=>{const b=$('#finishWork');if(b)b.disabled=true;try{stop();await act('finishJob',{token:state.me.job.token});beep('good');showWallet()}catch{if(b?.isConnected)b.disabled=false}};
 $('#finishWork').onclick=finish;$('#cancelWork').onclick=()=>confirmBox('Akhiri giliran?',session.rounds?'Babak yang sudah selesai sebaiknya diambil upahnya. Batalkan hanya jika ingin melepaskan seluruh upah.':'Belum ada babak selesai. Pembatalan tidak menghasilkan uang.',async()=>{await act('cancelJob');showJobs()},'Batalkan tanpa upah');
 function between(){stop();const job=state.me.job;if(!job)return showJobs();$('#workCount').textContent=job.rounds;$('#workPay').textContent=fmt(job.payout||0);$('#finishWork').disabled=job.rounds<1;$('#miniHost').innerHTML=`<div class="round-summary"><span class="tag">${job.rounds} BABAK TERSIMPAN</span><h3>Kerjamu sudah tercatat.</h3><p>Pilih lanjut untuk menambah upah, atau ambil hasilmu sekarang.</p><button class="btn primary" id="nextRound">Main babak berikutnya</button></div>`;$('#nextRound').onclick=play;}
 function play(){const job=state.me.job;if(!job)return showJobs();miniActive=true;$('#finishWork').disabled=true;workStop=runMinigame($('#miniHost'),j,(job.seed+job.sequence*1009)>>>0,async score=>{miniActive=false;try{const r=await act('jobRound',{token:job.token,sequence:job.sequence,score},true);if(r.dead){stop();world.respawn();showHome();toast('Kehidupan baru dimulai.',true);return}beep(score>=65?'good':'bad');between()}catch(e){stop();toast(e.message,true);between()}},beep)}
 if(session.rounds)between();else play();
}

function showMarket(){panel('Bekal untuk hari ini',`<p class="intro">Belanja bersifat opsional. Lapar dan haus tidak lagi menguras kondisi atau menghalangi pekerjaan. Makanan memberi sedikit pemulihan setelah bekerja.</p><div class="cards">${[{id:'meal',name:'Nasi rumahan',desc:'Santapan hangat · pemulihan +6.',price:10,icon:'food',color:'#c99875'},{id:'water',name:'Air mineral',desc:'Minuman segar · pemulihan +2.',price:4,icon:'drop',color:'#8fb6b7'},{id:'snack',name:'Roti hangat',desc:'Dari Bakery Mentari · pemulihan +3.',price:6,icon:'bread',color:'#ccb079'},{id:'fountain',name:'Air isi ulang',desc:'Air minum publik, gratis.',price:0,icon:'drop',color:'#83a69a'}].map(a=>`<article class="card"><div class="job-art" style="background:${a.color}">${icon(a.icon)}</div><h3>${a.name}</h3><p>${a.desc}</p><button class="btn wide" style="margin-top:15px" data-buy="${a.id}">${a.price?fmt(a.price)+' koin':'Ambil gratis'}</button></article>`).join('')}</div>`,{sub:'PASAR SENJA · DAPUR WARGA'});bindBuy();}
function bindBuy(){$$('[data-buy]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await act('buy',{item:b.dataset.buy});beep('good');}catch{}finally{b.disabled=false;}});}
function showClinic(){const p=state.me;panel('Istirahat, pulihkan diri.',`<div class="avatar-preview">${icon('heart')}</div><div class="stats-grid"><div class="stat-box"><span>Kesehatan</span><strong>${Math.round(p.health)}%</strong></div></div><p class="intro">Perawatan mengembalikan kesehatan ke 100%. Istirahat di kos menambah 15% kesehatan tanpa biaya. Kondisi ini hanya berkaitan dengan risiko pekerjaan.</p><button class="btn primary wide" data-buy="care">Perawatan klinik · 15 koin</button><button class="btn wide" style="margin-top:10px" data-buy="rest">Istirahat singkat · gratis</button>`,{narrow:true,sub:'KLINIK SEHAT'});bindBuy();}
function showHome(){const p=state.me,L=p.home===null?0:(p.houseLevel||1),current=HOUSE_LEVELS[L-1],next=HOUSE_LEVELS[L],available=p.coins-p.held;panel(L?current.name:'Kos Pelangi',`<canvas id="housePortrait" style="width:100%;height:190px;object-fit:contain;border-radius:14px"></canvas><div class="row spread"><span class="tag">${L?'Tingkat '+L+' / 20':'Belum punya tanah'}</span><b>${fmt(available)} koin</b></div><p class="intro">${L?'Petak '+(p.home+1)+' · Upgrade mengubah bangunan di peta.':'Kos gratis tersedia. Beli tanah untuk mendapatkan rumah tingkat 1.'}</p>${next&&L?`<div class="notice"><b>Berikutnya: ${next.name}</b><br>Biaya upgrade: ${fmt(next.cost)} koin<br>${available<next.cost?'Masih perlu '+fmt(next.cost-available)+' koin.':'Tabunganmu cukup untuk peningkatan ini.'}</div><button class="btn primary wide" id="upgradeHouse" ${available<next.cost?'disabled':''}>Naik ke tingkat ${L+1} · ${fmt(next.cost)} koin</button>`:L===20?'<div class="notice">Istana Nusa · tingkat tertinggi tercapai.</div>':'<button class="btn primary wide" data-nav="land">Cari tanah</button>'}<div class="row wrap" style="margin-top:12px"><button class="btn" id="houseLevels">Lihat 20 tahap</button><button class="btn" data-buy="rest">Istirahat gratis</button>${L?'<button class="btn" id="locateHome">Lihat rumah di kota</button>':''}</div>${aptHomeBlock()}<h3 class="section-title">Kenangan</h3>${p.memories.slice(0,8).map(m=>`<div class="list-item">${esc(m)}</div>`).join('')}`,{narrow:true,sub:'RUMAH & TABUNGAN'});world.housePreview($('#housePortrait'),L||1);bindBuy();$('#homeKtp').onclick=()=>showKTP();$('#homeApt').onclick=()=>showApt(p.apt?p.apt.t:0);$('#houseLevels').onclick=()=>showHouseLevels(L||1);if($('#locateHome'))$('#locateHome').onclick=()=>{const pos=world.plotPosition(p.home);closePanel();world.navigate(pos.x,pos.z)};if($('#upgradeHouse'))$('#upgradeHouse').onclick=()=>confirmBox('Tingkatkan rumah?',`${esc(current.name)} → <b>${esc(next.name)}</b><br>Biaya: ${fmt(next.cost)} koin.<br>Sisa: ${fmt(available-next.cost)} koin.`,async()=>{await act('upgradeHouse',{fromLevel:L});beep('good');showHome();},'Bayar & tingkatkan');}
function showHouseLevels(chosen=1){const p=state.me,own=p.home===null?0:(p.houseLevel||1),l=HOUSE_LEVELS[chosen-1];panel('20 tahap rumah',`<canvas id="levelPortrait" style="width:100%;height:190px;object-fit:contain;border-radius:14px"></canvas><h3>${l.name}</h3><p class="intro">Tingkat ${chosen}. ${chosen===1?'Termasuk pembelian tanah.':'Biaya dari tingkat sebelumnya: '+fmt(l.cost)+' koin.'}<br>Harus naik satu tingkat setiap pembelian. Koin didapat dari bekerja; rumah tidak menghasilkan koin pasif.</p><div class="cards">${HOUSE_LEVELS.map(v=>`<button class="btn" data-house-stage="${v.level}" style="text-align:left">${v.level}. ${esc(v.name)}<br><small>${v.level===1?'Termasuk tanah':fmt(v.cost)+' koin'} · ${v.level<=own?'Tercapai':'Terkunci'}</small></button>`).join('')}</div><button class="btn primary wide" id="backHouse" style="margin-top:12px">Kembali ke rumah</button>`,{sub:'DARI GUBUK HINGGA ISTANA'});world.housePreview($('#levelPortrait'),chosen);$$('[data-house-stage]').forEach(b=>b.onclick=()=>showHouseLevels(Number(b.dataset.houseStage)));$('#backHouse').onclick=showHome;}

function showLand(district=0,page=0){

function chatRules(){panel('Aturan ngobrol', '<p class="intro">Dua pelanggaran pertama mendapat peringatan; pesan ditolak. Pelanggaran berikutnya diberi hukuman sesuai kategorinya.</p><div class="list-item">Ringan → bisu 10 menit</div><div class="list-item">Sedang → bisu 1 jam</div><div class="list-item">Berat → bisu 1 hari</div><div class="list-item">Sangat tidak pantas → bisu 2 hari</div><div class="list-item">Sangat melanggar → ban kota 30 hari</div><div class="notice warn">Lima hukuman dalam 30 hari → diusir dari Kota Nusa. Filter berbasis kata/pola dapat keliru; Presiden dapat meninjau laporan dan memulihkan akses.</div>',{narrow:true});}
const FB={
 base(){let u=String(NUSA_CONFIG.FIREBASE_DB_URL||'').trim().replace(/\/+$/,'');if(!u)return '';u=u.replace(/^http:\/\//i,'https://');if(!/^https:\/\//i.test(u))u='https://'+u;return u;},
 dead:false,
 on(){return !!this.base()&&!this.dead;},
 url(path,qs=''){return this.base()+'/'+path+'.json'+qs;},
 fail(r){return Error(r.status===401||r.status===403?'Akses ditolak server. Periksa Rules database (lihat petunjuk).':r.status===404?'Alamat database tidak ditemukan. Periksa FIREBASE_DB_URL.':'Server chat error '+r.status);},
 async get(path,qs=''){const r=await fetch(this.url(path,qs),{cache:'no-store'});if(!r.ok)throw this.fail(r);return r.json();},
 async post(path,body){const r=await fetch(this.url(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw this.fail(r);return r.json();},
 async put(path,body){const r=await fetch(this.url(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw this.fail(r);return r.json();}
};
const NET={
 mode(){return FB.on()?'firebase':(NUSA_CONFIG.NTFY_TOPIC?'ntfy':'local');},
 server(){return String(NUSA_CONFIG.NTFY_SERVER||'https://ntfy.sh').replace(/\/+$/,'');},
 async ntfyPost(topic,obj){const r=await fetch(this.server()+'/'+encodeURIComponent(topic),{method:'POST',body:JSON.stringify(obj)});if(!r.ok)throw Error(r.status===429?'Terlalu banyak pesan. Tunggu sebentar lalu coba lagi.':'Gagal kirim ('+r.status+')');return r.json().catch(()=>({}));},
 parseEvt(raw){try{const e=typeof raw==='string'?JSON.parse(raw):raw;if(e.event&&e.event!=='message')return null;let o;try{o=JSON.parse(e.message);}catch{return null;}if(!o||typeof o!=='object')return null;return {...o,k:e.id,t:(e.time||0)*1000};}catch{return null;}},
 async ntfyHistory(topic,since='all'){const r=await fetch(this.server()+'/'+encodeURIComponent(topic)+'/json?poll=1&since='+since,{cache:'no-store'});if(!r.ok)throw Error('Server chat error '+r.status);const txt=await r.text();return txt.split('\n').filter(Boolean).map(l=>this.parseEvt(l)).filter(Boolean);}
};
let chatPoll=0,chatES=null;
function openChat(){
 if(!entered)return join();
 const mode=NET.mode(),online=mode!=='local',me=()=>state.me;
 panel('Chat warga',`${online?'<div class="chat-status" id="chatStatus"><i></i><span>Menghubungkan…</span></div>':'<div class="notice warn">Chat online dimatikan oleh pemilik game, jadi pesan hanya tersimpan di HP ini.</div>'}<div class="row spread" style="margin:8px 0"><span class="tag">Peringatan: ${me().chatWarnings||0}/2</span><button class="btn small" id="chatRules">Aturan</button></div><div class="chat-wrap"><div id="localMessages" class="chat-messages chat-big" aria-live="polite"></div><button class="chat-jump hidden" id="chatJump" type="button">↓ Pesan baru</button></div><form id="localChatForm" class="chat-compose"><input class="input" id="localChatInput" maxlength="220" placeholder="Tulis pesan sopan…" autocomplete="off" enterkeyhint="send"><button class="btn primary" id="localChatSend">Kirim</button></form><p id="chatFeedback" role="status"></p>`,{narrow:true,sub:online?'CHAT WARGA · REAL-TIME':'CHAT · MODE LOKAL'});
 $('#chatRules').onclick=chatRules;
 const box=$('#localMessages'),jump=$('#chatJump'),status=$('#chatStatus');let lastKey='',items=[],first=true,stopped=false;
 const setStatus=(ok,text)=>{if(!status)return;status.classList.toggle('bad',!ok);status.querySelector('span').textContent=text;};
 const nearBottom=()=>box.scrollHeight-box.scrollTop-box.clientHeight<90;
 const toBottom=()=>{box.scrollTop=box.scrollHeight;requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;});jump.classList.add('hidden');};
 const render=(force)=>{const stick=force||first||nearBottom();
  box.innerHTML=items.length?items.map(m=>`<div class="chat-message ${m.mine?'mine':''} ${m.r==='p'?'pres':''}"><time>${m.t?new Date(m.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):''}</time><strong>${m.r==='p'?'👑 ':''}${esc(m.n)}</strong><p>${esc(m.m)}</p></div>`).join(''):'<p class="empty">Belum ada pesan.<br>Sapa warga pertama!</p>';
  if(stick)toBottom();else jump.classList.remove('hidden');first=false;};
 jump.onclick=toBottom;
 const pull=async(force)=>{if(stopped)return;
  try{let list;
   if(mode==='firebase'){const data=await FB.get(NUSA_CONFIG.CHAT_PATH,'?orderBy=%22%24key%22&limitToLast=60');list=Object.entries(data||{}).sort((x,y)=>x[0]<y[0]?-1:1).map(([k,v])=>({k,...v,mine:v.u===me().id}));setStatus(true,'Tersambung · pesan masuk otomatis');}
   else{const d=await request('/api/chat');list=(d.messages||[]).map(m=>({k:m.id,n:m.name,m:m.message,t:m.created,mine:true}));}
   const key=list.at(-1)?.k||'';if(key!==lastKey||force||first){const prev=lastKey;lastKey=key;items=list;render(force||(list.at(-1)?.mine&&key!==prev));}
  }catch(e){if(online)setStatus(false,e.message||'Terputus, mencoba lagi…');}};
 clearInterval(chatPoll);if(chatES){chatES.close();chatES=null;}
 if(mode==='ntfy'){
  const seen=new Map();let timer=0;
  const flush=()=>{timer=0;if(!box.isConnected){chatES&&chatES.close();chatES=null;return;}items=[...seen.values()].sort((a,b)=>a.t-b.t||(a.k<b.k?-1:1)).slice(-60).map(m=>({...m,mine:m.u===me().id}));const key=items.at(-1)?.k||'';const wasMine=items.at(-1)?.mine&&key!==lastKey;lastKey=key;render(wasMine);};
  const add=m=>{if(!m||seen.has(m.k)||typeof m.m!=='string'||typeof m.n!=='string')return;m.n=String(m.n).slice(0,24);m.m=String(m.m).slice(0,220);seen.set(m.k,m);if(!timer)timer=setTimeout(flush,80);};
  try{chatES=new EventSource(NET.server()+'/'+encodeURIComponent(NUSA_CONFIG.NTFY_TOPIC)+'/sse?since=6h');
   chatES.onopen=()=>setStatus(true,'Tersambung · pesan masuk otomatis');
   chatES.onerror=()=>setStatus(false,'Menyambung ulang…');
   chatES.onmessage=e=>add(NET.parseEvt(e.data));}catch(e){setStatus(false,'Browser ini tidak mendukung chat online.');}

const SOCIAL={
 houses:{},apt:{},sig:'',lastRemote:'',timer:0,denied:false,started:false,busy:false,igTried:false,
 on(){return FB.on()&&!this.denied;},

 },
 async pull(){

 },
 merge(list){

  const rem=[];
  for(const [k,v] of Object.entries(this.houses||{})){
   if(!v||!v.id||v.free||v.id===me||ids.has(v.id))continue;
   const plot=Number(k);if(!(plot>=0&&plot<240)||used.has(plot))continue;
   rem.push({id:v.id,name:String(v.n||'Warga').slice(0,24),ig:String(v.ig||'').slice(0,30),color:/^#[0-9a-f]{6}$/i.test(v.c)?v.c:'#569d91',role:'citizen',home:plot,houseLevel:Math.max(1,Math.min(20,Number(v.lv)||1)),decor:['sage','coral','blue','sand'].includes(v.dc)?v.dc:'sage',xp:0,jobs:0,life:1,joined:Number(v.j)||0,career:{name:'Warga'},remote:true});
   used.add(plot);

 },
 houseRec(p){return {id:p.id,n:p.name,ig:p.ig||'',c:p.color,lv:p.houseLevel||1,dc:p.decor||'sage',j:p.joined||0,t:{'.sv':'timestamp'}};},
 ktpRec(p){return {n:p.name,ig:p.ig||'',bio:p.bio||'',c:p.color,rk:p.career&&p.career.name||'Warga',j:p.joined||0,h:p.home===undefined?null:p.home,a:p.apt||null,l:p.life||1,t:{'.sv':'timestamp'}};},
 async sync(){
  const p=state.me;if(!p||!this.on()||this.busy)return;
  if(!p.ig&&!this.igTried){const f=typeof flightLoad==='function'?flightLoad():null;if(f&&f.ig){this.igTried=true;act('profile',{ig:f.ig}).catch(()=>{this.igTried=false;});return;}}

    const cur=await FB.get('houses/'+p.home);

   }else{
    for(const [k,v] of Object.entries(this.houses||{}))if(v&&v.id===p.id&&!v.free)await FB.put('houses/'+k,{id:p.id,free:true});
   }
   if(p.apt){const k=p.apt.t+'_'+p.apt.u,cur=await FB.get('apt/'+k);if(!cur||!cur.id||cur.free||cur.id===p.id)await FB.put('apt/'+k,{id:p.id,n:p.name,ig:p.ig||'',c:p.color});}

 },

 },

 },

  const home=c.home===undefined?c.h:c.home,apt=c.apt!==undefined?c.apt:c.a;
  let addr='Kos Pelangi';
  if(home!==null&&home!==undefined){const d=typeof districtFor==='function'?districtFor(home):null;addr='Petak '+(home+1)+(d?' · '+d.name:'');}
  else if(apt)addr='Apartemen '+(apt.t+1)+' · Lantai '+(apt.u+1);
  const role=c.role==='president'?'Presiden':c.role==='mayor'?'Wali Kota':(c.career&&c.career.name)||c.rk||'Warga';
  return {id:c.id,name:c.name||c.n||'Warga',ig:c.ig||'',bio:c.bio||'',color:c.color||c.c||'#569d91',role,joined:c.joined||c.j||0,addr,life:c.life||c.l||1};
}
function drawKTP(cv,d){
  const c=cv.getContext('2d'),W=720,H=450;
  const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);};
  c.clearRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#123b3e');g.addColorStop(.6,'#1d5f5c');g.addColorStop(1,'#2f7f78');
  c.save();rr(0,0,W,H,28);c.clip();c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(169,219,192,.13)';c.lineWidth=2;
  for(let k=0;k<7;k++){c.beginPath();for(let x=0;x<=W;x+=12){const y=150+k*38+Math.sin(x/46+k)*9;x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
  c.fillStyle='#fff9ec';c.fillRect(0,0,W,76);
  c.fillStyle='#569d91';c.beginPath();c.arc(48,38,22,0,7);c.fill();
  c.fillStyle='#fff9ec';c.font='800 24px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('N',48,39);
  c.textAlign='left';c.fillStyle='#123b3e';c.font='800 26px system-ui,sans-serif';c.fillText('KOTA NUSA',84,30);
  c.fillStyle='#5f8a80';c.font='700 11px system-ui,sans-serif';c.fillText('KARTU PENDUDUK  ·  SEBUAH KEHIDUPAN BARU',84,55);
  c.fillStyle='#e3ad94';c.beginPath();c.arc(W-44,38,10,0,7);c.fill();c.fillStyle='#a9dbc0';c.beginPath();c.arc(W-66,38,10,0,7);c.fill();c.fillStyle='#6494ac';c.beginPath();c.arc(W-88,38,10,0,7);c.fill();
  // foto
  c.fillStyle=d.color;rr(36,100,156,190,18);c.fill();
  c.fillStyle='rgba(255,249,236,.9)';c.beginPath();c.arc(114,166,30,0,7);c.fill();
  c.beginPath();c.moveTo(56,290);c.quadraticCurveTo(114,196,172,290);c.closePath();c.fill();
  c.strokeStyle='rgba(255,249,236,.55)';c.lineWidth=3;rr(36,100,156,190,18);c.stroke();
  // barcode
  const nik=nikOf(d.id);let h=7;c.fillStyle='rgba(255,249,236,.85)';
  for(let x=36;x<192;){h=(h*31+nik.charCodeAt(Math.floor((x-36)/6)%nik.length)+x)>>>0;const w=1+h%3;c.fillRect(x,304,w,26);x+=w+1+(h>>3)%2;}
  const L=(t,x,y)=>{c.fillStyle='#a9dbc0';c.font='700 12px system-ui,sans-serif';c.textAlign='left';c.fillText(t,x,y);};
  const V=(t,x,y,size,maxW,wt)=>{c.fillStyle='#fff9ec';c.font=(wt||'700')+' '+size+'px system-ui,sans-serif';c.textAlign='left';c.fillText(t,x,y,maxW);};
  L('NIK NUSA',224,108);V(nik,224,136,30,456,'800');
  L('NAMA',224,162);V(d.name,224,190,30,456,'800');
  L('INSTAGRAM',224,216);V(d.ig?'@'+d.ig:'—',224,242,23,210,'700');
  L('STATUS',444,216);V(d.role,444,242,23,240,'700');
  L('TEMPAT TINGGAL',224,268);V(d.addr,224,294,21,456,'600');
  L('WARGA SEJAK',224,316);V(d.joined?new Date(d.joined).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—',224,340,20,200,'600');
  // deskripsi
  c.fillStyle='rgba(255,249,236,.12)';rr(36,346,648,74,14);c.fill();
  L('DESKRIPSI',54,366);
  const words=(d.bio||'Warga baru Kota Nusa.').split(' '),lines=[''];
  c.font='italic 600 17px system-ui,sans-serif';
  for(const w of words){const t=(lines.at(-1)+' '+w).trim();if(c.measureText(t).width>610&&lines.at(-1)){if(lines.length>=2){lines[1]=lines[1].replace(/.{0,2}$/,'…');break;}lines.push(w);}else lines[lines.length-1]=t;}
  c.fillStyle='#fff9ec';c.textAlign='left';lines.forEach((t,i)=>c.fillText(t,54,390+i*22,616));
  c.fillStyle='#e3ad94';c.fillRect(0,H-12,W,12);c.fillStyle='#a9dbc0';c.fillRect(0,H-12,W*.4,12);c.fillStyle='#6494ac';c.fillRect(W*.4,H-12,W*.2,12);
  c.restore();
}
async function showKTP(id){
  const me=state.me;if(!me)return;
  const mine=!id||id===me.id;
  let src=mine?me:(state.citizens.find(x=>x.id===id)||{id,name:'Warga'});
  panel(mine?'Kartu Penduduk-ku':'Kartu '+esc(src.name||'Warga'),`<canvas id="ktpCanvas" width="720" height="450" class="ktp-canvas"></canvas>${mine?`<label class="field" style="margin-top:14px"><span>Username Instagram</span><input class="input" id="ktpIg" maxlength="30" placeholder="contoh: lala" value="${esc(me.ig||'')}"></label><label class="field"><span>Deskripsi dirimu (maks 90 huruf)</span><textarea class="input" id="ktpBio" maxlength="90" rows="2" placeholder="Contoh: Suka kopi sore dan jalan di pantai.">${esc(me.bio||'')}</textarea></label><p class="form-error" id="ktpErr"></p><div class="row wrap"><button class="btn primary grow" id="ktpSave">Simpan kartu</button><button class="btn" id="ktpImg">Simpan gambar</button></div>`:`<div class="row wrap" style="margin-top:14px"><button class="btn primary grow" id="ktpImg">Simpan gambar</button>${src.home!==undefined&&src.home!==null?'<button class="btn" id="ktpLoc">Lihat rumahnya</button>':''}</div>`}`,{narrow:true,sub:'KARTU PENDUDUK KOTA NUSA'});
  const cv=$('#ktpCanvas'),redraw=()=>drawKTP(cv,ktpData(mine?state.me:src,mine));
  redraw();
  if(mine){
   const liveRedraw=()=>{const t={...state.me,ig:$('#ktpIg').value.trim().replace(/^@/,''),bio:cleanBio($('#ktpBio').value)};drawKTP(cv,ktpData(t,true));};
   $('#ktpIg').oninput=liveRedraw;$('#ktpBio').oninput=liveRedraw;
   $('#ktpSave').onclick=async()=>{const b=$('#ktpSave');b.disabled=true;$('#ktpErr').textContent='';try{await act('profile',{ig:$('#ktpIg').value,bio:$('#ktpBio').value});toast('Kartu penduduk disimpan.');redraw();}catch(e){$('#ktpErr').textContent=e.message||'Gagal menyimpan.';}finally{if(b.isConnected)b.disabled=false;}};
  }else if(SOCIAL.on()){
   FB.get('ktp/'+id).then(r=>{if(!r||!$('#ktpCanvas'))return;src={...src,name:r.n||src.name,ig:r.ig||src.ig,bio:r.bio||'',color:r.c||src.color,career:{name:r.rk||'Warga'},joined:r.j||src.joined,home:r.h===undefined?src.home:r.h,apt:r.a||null,life:r.l||1};redraw();}).catch(()=>{});
  }
  $('#ktpImg').onclick=()=>{cv.toBlob(async blob=>{if(!blob)return;const name='ktp-kota-nusa.png';try{const f=new File([blob],name,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'KTP Kota Nusa'});return;}}catch(e){if(e&&e.name==='AbortError')return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');};
  if($('#ktpLoc'))$('#ktpLoc').onclick=()=>{const pos=world.plotPosition(src.home);closePanel();world.navigate(pos.x,pos.z);};
}
