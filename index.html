function makePlayer(name, color, now) { return { id: crypto.randomUUID(), name, color, coins: 250, held: 0, xp: 0, hunger: 100, thirst: 100, health: 100, active: 0, joined: now, lastTick: now, salaryAt: 0, lastAction: 0, jobs: 0, skills: {}, inventory: {}, home: null, ig: '', bio: '', apt: null, decor: 'sage', life: 1, memories: ['Tiba di Nusa · ' + new Date(now).toISOString().slice(0, 10)], friends: [], requests: [], blocks: [], mutedUntil: 0, banned: false, tutorial: 0, job: null, claimTries: 0, claimAt: 0 }; }

function publicPlayer(w, p) { return { id: p.id, name: p.name, color: p.color, role: role(w, p.id), home: p.home, ig: p.ig||'', bio: p.bio||'', apt: p.apt||null, houseLevel:p.home===null?0:(p.houseLevel||1), business:p.business?{name:p.business.name,type:p.business.type,level:p.business.level}:null, xp: p.xp, life: p.life, jobs: p.jobs, joined: p.joined, decor: p.decor, career: career(p.xp) }; }
function record(w, kind, text, actor, amount = 0, now = Date.now()) { w.ledger.unshift({ id: crypto.randomUUID(), kind, text, actor, amount, time: now }); w.ledger = w.ledger.slice(0, 200); }
function demand(condition, message) { if (!condition)
    throw new Error(message); }
function clean(s, max = 180) { return String(s ?? '').replace(/[\u0000-\u001f\u007f<>]/g, '').trim().slice(0, max); }
function num(n, min, max) { demand(typeof n === 'number' && Number.isFinite(n) && n >= min && n <= max, 'Angka di luar batas.'); return n; }
function amount(n, min = 1, max = 1000000) { num(n, min, max); demand(Number.isInteger(n), 'Gunakan jumlah bulat.'); return n; }
function byId(w, id) { return Object.values(w.players).find(p => p.id === id); }
function legacyRefresh(w, now) {
    w.channels ??= DEFAULT_CHANNELS;
    if (w.pendingTax && w.pendingTax.at <= now) {
        w.tax = w.pendingTax.value;
        w.pendingTax = null;
    }
    if (w.vote && w.vote.status === 'open' && w.vote.ends <= now) {
        const v = w.vote;
        v.counts = v.options.map((_, i) => Object.values(v.votes).filter(x => x === i).length);
        const max = Math.max(...v.counts);
        if (!max) {
            const p = byId(w, v.owner);
            if (p)
                p.held -= v.reserve;
            v.status = 'empty';
            record(w, 'vote', 'Voting berakhir tanpa suara; dana dilepas.', v.owner, 0, now);
        }
        else {
            const wins = v.counts.map((n, i) => n === max ? i : -1).filter((n) => n >= 0);
            if (wins.length > 1) {
                v.status = 'tie';
                v.tied = wins;
            }
            else
                buildWinner(w, wins[0], now);
        }
    }
}

function buildWinner(w, index, now) { const v = w.vote; const candidate = v.options[index]; const owner = byId(w, v.owner); demand(owner, 'Pemilik anggaran tidak ditemukan.'); demand(owner.coins >= candidate.cost && owner.held >= v.reserve, 'Dana pembangunan tidak tersedia.'); owner.coins -= candidate.cost; owner.held -= v.reserve; w.projects.push({ ...candidate, id: crypto.randomUUID(), started: now, ready: now + 300000, slot: v.slot }); v.status = 'built'; v.winner = index; record(w, 'build', 'Pembangunan ' + candidate.name + ' dibiayai Presiden.', owner.id, -candidate.cost, now); w.news.unshift({ id: crypto.randomUUID(), title: candidate.name + ' segera hadir!', text: 'Pilihan warga sedang dibangun. Peresmian dalam 5 menit.', author: 'Balai Nusa', time: now }); w.news = w.news.slice(0, 30); }
function tick(p, w, now) { const dt = Math.max(0, Math.min(15, (now - p.lastTick) / 1000)); p.lastTick = now; p.active += dt; p.hunger = 100; p.thirst = 100; p.health = Math.min(100, p.health + dt * .008); const r = role(w, p.id); if ((r === 'president' || r === 'vice') && p.active - p.salaryAt >= 1200) {
    const salary = r === 'president' ? 300 : 200;
    if (w.treasury >= salary) {
        w.treasury -= salary;
        p.coins += salary;
        p.salaryAt = p.active;
        record(w, 'salary', 'Gaji jabatan ' + p.name, p.id, salary, now);
    }
} }
function die(w, p, now) { if (w.vote?.owner === p.id && ['open', 'tie'].includes(w.vote.status)) {
    w.vote.status = 'cancelled';
    record(w, 'vote', 'Anggaran voting dilepas: karakter pemilik memulai hidup baru.', p.id, 0, now);
} p.coins = 250; p.held = 0; p.xp = 0; p.hunger = 100; p.thirst = 100; p.health = 100; p.home = null; p.houseLevel=0;p.civicQualifiedAt=null; p.skills = {}; p.inventory = {}; p.jobs = 0; p.life++; p.job = null; p.memories.unshift('Memulai kehidupan ke-' + p.life + ' · ' + new Date(now).toISOString().slice(0, 10)); p.memories = p.memories.slice(0, 20); }

function view(w, uid) { const p = w.players[uid]; return { me: p ? { ...p, role: role(w, p.id), career: career(p.xp), nusaV2: v2View(w,p) } : null, city: { tax: w.tax, pendingTax: w.pendingTax, treasury: w.treasury, civicXP:500, civicQueue:Object.values(w.players).filter(p=>!p.banned&&p.xp>=500&&p.id!==w.president&&p.id!==w.vice).sort((a,b)=>a.civicQualifiedAt-b.civicQualifiedAt||a.id.localeCompare(b.id)).map(p=>({id:p.id,name:p.name,xp:p.xp,at:p.civicQualifiedAt})), termDays: w.termDays, mayorUntil: w.mayorUntil, president: w.president, vice: w.vice, mayor: w.mayor, youtube: w.youtube, channels: w.channels ?? DEFAULT_CHANNELS, created: w.created, news: w.news, projects: w.projects, events: w.events.filter(e => e.until > Date.now()), vote: w.vote ? { ...w.vote, votes: undefined, counts: w.vote.options.map((_, i) => Object.values(w.vote.votes).filter(v => v === i).length), myVote: p ? w.vote.votes[p.id] ?? null : null } : null }, citizens: Object.values(w.players).filter(x => !x.banned).map(x => publicPlayer(w, x)), ledger: p ? w.ledger.filter(x => ['president', 'vice'].includes(role(w, p.id)) || x.actor === p.id || ['tax', 'build', 'vote', 'office', 'salary'].includes(x.kind)).slice(0, 50) : [], bannedCitizens: p && role(w, p.id) === 'president' ? Object.values(w.players).filter(x => x.banned).map(x => publicPlayer(w, x)) : [], reports: p && ['president', 'vice'].includes(role(w, p.id)) ? w.reports : [], now: Date.now() }; }

function refresh(w,now){legacyRefresh(w,now);for(const owner of Object.values(w.players))orchardHarvest(w,owner,now);for(const p of Object.values(w.players)){if(p.bannedUntil&&p.bannedUntil<=now&&!p.expelled){p.banned=false;p.bannedUntil=0;}if(p.expelled)p.banned=true;}const eligible=p=>!p.banned&&p.xp>=500&&p.id!==w.president&&p.id!==w.vice;
 for(const p of Object.values(w.players)){p.houseLevel=p.home===null?0:Math.max(1,Math.min(20,Math.trunc(p.houseLevel||1)));if(p.xp>=500&&!p.civicQualifiedAt)p.civicQualifiedAt=now;if(p.xp<500)p.civicQualifiedAt=null;}
 const current=byId(w,w.mayor);if(current&&eligible(current)&&w.mayorUntil>now)return;
 const previous=w.mayor;let candidates=Object.values(w.players).filter(eligible).sort((a,b)=>a.civicQualifiedAt-b.civicQualifiedAt||a.id.localeCompare(b.id));
 if(current&&w.mayorUntil<=now){const others=candidates.filter(p=>p.id!==previous);if(others.length)candidates=others;}
 const next=candidates[0];w.mayor=next?.id??null;w.mayorUntil=next?now+w.termDays*86400000:0;
 if(previous!==w.mayor)record(w,'office',next?next.name+' terpilih: paling awal memenuhi 500 EXP.':'Kursi Wali Kota menunggu warga yang memenuhi 500 EXP.','system',0,now);
}

 if(tab==='Proyek')return `<p class="intro">Pembangunan hasil voting berada di distrik utara. ${owner?'Buka pemilihan baru melalui tab Bangunan.':'Anggaran dan pilihan kandidat ditetapkan Presiden.'}</p><button class="btn wide" data-nav="vote">${icon('hall')} Lihat pemilihan warga</button><div class="project-list">${state.city.projects.map(project=>`<article class="card"><span class="tag">${Date.now()>=project.ready?'Selesai':Math.min(99,Math.max(0,Math.floor((Date.now()-project.started)/(project.ready-project.started)*100)))+'% · Pekerja sedang membangun'}</span><h3>${esc(project.name)}</h3><p>Lokasi ${project.slot+1} · ${fmt(project.cost)} koin</p><p>Peresmian: ${niceDate(project.ready)}</p><button class="btn small" data-project-slot="${project.slot}">Lihat di kota ${icon('arrow')}</button></article>`).join('')||'<div class="empty">Belum ada proyek hasil voting.<br>Kota menunggu pilihan pertamanya.</div>'}</div>`;
 if(tab==='Warga')return `<p class="intro">Wakil dapat membisukan chat warga selama 10 menit. Presiden juga dapat menangguhkan dan memulihkan akun.</p><div class="office-roster">${state.citizens.map(c=>`<article><div><strong>${esc(c.name)}</strong><small>${esc(officeLabel(c.role))} · ${fmt(c.xp)} EXP</small></div>${c.role==='citizen'?`<button class="btn small" data-mute="${c.id}">Mute</button>${owner?`<button class="btn small danger" data-ban="${c.id}">Tangguhkan</button>`:''}`:'<span class="tag">Pejabat</span>'}</article>`).join('')}</div>${owner?`<h3 class="section-title">Akun ditangguhkan</h3>${(state.bannedCitizens??[]).map(c=>`<div class="row spread list-item"><strong>${esc(c.name)}</strong><button class="btn small" data-unban="${c.id}">Pulihkan akun</button></div>`).join('')||'<p class="intro">Tidak ada akun yang ditangguhkan.</p>'}`:''}`;
 return '';
}

function jobInfo(id){if(!state.me)return join();const j=catalog.jobs.find(j=>j.id===id),site=catalog.places.find(p=>p.id===j.workplace);world.navigate(site.x,site.z);panel(j.name,`<div class="job-art" style="height:100px;background:${j.color}">${icon(j.icon)}</div><p class="intro" style="margin-top:17px">${j.desc}</p><div class="stats-grid"><div class="stat-box"><span>Maks. per babak</span><strong>${Math.round(j.pay/5)}</strong></div><div class="stat-box"><span>Durasi babak</span><strong>±30 dtk</strong></div><div class="stat-box"><span>Jumlah babak</span><strong>Bebas</strong></div></div>${j.risk>=2?`<div class="notice ${j.risk>=3?'warn':''}">Putaran gagal dapat mengurangi kesehatan. Jika kesehatan mencapai nol, karakter memulai ulang: rumah, uang, barang, dan keterampilan direset. Akun, teman, dan hak Owner tetap ada.</div>`:'<div class="notice">Profesi ini cocok untuk memulai. Gagal tugas tidak menyebabkan kematian.</div>'}${j.risk>=3?'<label class="check"><input type="checkbox" id="riskAck"><span>Saya memahami risiko karakter dan siap mengikuti misi. Perlengkapan keselamatan termasuk dalam tugas.</span></label>':''}<div class="row"><button class="btn grow" id="jobBack">Kembali</button><button class="btn primary grow" id="jobStart">Mulai bekerja</button></div>`,{narrow:true,sub:site.name.toUpperCase()});$('#jobBack').onclick=()=>showWorkplace(j.workplace);$('#jobStart').onclick=async()=>{const b=$('#jobStart');b.disabled=true;try{await act('startJob',{job:id,workplace:j.workplace,ack:$('#riskAck')?.checked||false});startRound();}catch{}finally{if(b.isConnected)b.disabled=false;}};}
function startRound(){const session=state.me?.job;if(!session)return showJobs();const j=catalog.jobs.find(j=>j.id===session.id);
 panel(j.name,`<div class="work-status"><span>BABAK TUNTAS<strong id="workCount">${session.rounds}</strong></span><span>UPAH KOTOR<strong id="workPay">${fmt(session.payout||0)}</strong></span><span>KONDISI<strong>${Math.round(state.me.health)}%</strong></span></div><div id="miniHost"></div><div class="row spread" style="margin-top:14px"><button class="btn small" id="cancelWork">Batalkan</button><button class="btn primary" id="finishWork" disabled>Selesai & ambil upah</button></div><p class="intro">Selesaikan satu babak, lalu pilih berhenti atau lanjut. Babak yang belum selesai tidak dibayar. Pajak dipotong saat mengambil upah.</p>`,{work:true,sub:'KERJA SESUAI JUMLAH BABAK'});
 const stop=()=>{if(workStop){workStop();workStop=null}miniActive=false};
 const finish=async()=>{const b=$('#finishWork');if(b)b.disabled=true;try{stop();await act('finishJob',{token:state.me.job.token});beep('good');showWallet()}catch{if(b?.isConnected)b.disabled=false}};
 $('#finishWork').onclick=finish;$('#cancelWork').onclick=()=>confirmBox('Akhiri giliran?',session.rounds?'Babak yang sudah selesai sebaiknya diambil upahnya. Batalkan hanya jika ingin melepaskan seluruh upah.':'Belum ada babak selesai. Pembatalan tidak menghasilkan uang.',async()=>{await act('cancelJob');showJobs()},'Batalkan tanpa upah');
 function between(){stop();const job=state.me.job;if(!job)return showJobs();$('#workCount').textContent=job.rounds;$('#workPay').textContent=fmt(job.payout||0);$('#finishWork').disabled=job.rounds<1;$('#miniHost').innerHTML=`<div class="round-summary"><span class="tag">${job.rounds} BABAK TERSIMPAN</span><h3>Kerjamu sudah tercatat.</h3><p>Pilih lanjut untuk menambah upah, atau ambil hasilmu sekarang.</p><button class="btn primary" id="nextRound">Main babak berikutnya</button></div>`;$('#nextRound').onclick=play;}
 function play(){const job=state.me.job;if(!job)return showJobs();miniActive=true;$('#finishWork').disabled=true;workStop=runMinigame($('#miniHost'),j,(job.seed+job.sequence*1009)>>>0,async score=>{miniActive=false;try{const r=await act('jobRound',{token:job.token,sequence:job.sequence,score},true);if(r.dead){stop();world.respawn();showHome();toast('Kehidupan baru dimulai.',true);return}beep(score>=65?'good':'bad');between()}catch(e){stop();toast(e.message,true);between()}},beep)}
 if(session.rounds)between();else play();
}

oin.<br>Sisa: ${fmt(available-next.cost)} koin.`,async()=>{await act('upgradeHouse',{fromLevel:L});beep('good');showHome();},'Bayar & tingkatkan');}
function showHouseLevels(chosen=1){const p=state.me,own=p.home===null?0:(p.houseLevel||1),l=HOUSE_LEVELS[chosen-1];panel('20 tahap rumah',`<canvas id="levelPortrait" style="width:100%;height:190px;object-fit:contain;border-radius:14px"></canvas><h3>${l.name}</h3><p class="intro">Tingkat ${chosen}. ${chosen===1?'Termasuk pembelian tanah.':'Biaya dari tingkat sebelumnya: '+fmt(l.cost)+' koin.'}<br>Harus naik satu tingkat setiap pembelian. Koin didapat dari bekerja; rumah tidak menghasilkan koin pasif.</p><div class="cards">${HOUSE_LEVELS.map(v=>`<button class="btn" data-house-stage="${v.level}" style="text-align:left">${v.level}. ${esc(v.name)}<br><small>${v.level===1?'Termasuk tanah':fmt(v.cost)+' koin'} · ${v.level<=own?'Tercapai':'Terkunci'}</small></button>`).join('')}</div><button class="btn primary wide" id="backHouse" style="margin-top:12px">Kembali ke rumah</button>`,{sub:'DARI GUBUK HINGGA ISTANA'});world.housePreview($('#levelPortrait'),chosen);$$('[data-house-stage]').forEach(b=>b.onclick=()=>showHouseLevels(Number(b.dataset.houseStage)));$('#backHouse').onclick=showHome;}

function showLand(district=0,page=0){
 const p=state.me,d=DISTRICTS[district]||DISTRICTS[0],pages=Math.ceil(d.count/24);page=Math.max(0,Math.min(pages-1,page));
 const free=LAND_COUNT-state.citizens.filter(c=>c.home!==null).length;
 panel('Pilih lingkungan rumahmu',`<p class="intro">240 petak di empat kawasan. Rumah lama tetap milik pemiliknya; lahan baru mulai 420 koin termasuk rumah tingkat 1.</p><div class="row spread"><span class="tag">${free} petak tersedia</span><span class="tag">Satu rumah per warga</span></div><div class="chips" style="margin-top:16px">${DISTRICTS.map((x,i)=>`<button class="chip ${i===district?'active':''}" data-district="${i}">${x.name} · ${x.count}</button>`).join('')}</div><div class="row spread land-pagination"><button class="btn small" id="landPrev" ${page===0?'disabled':''}>← Sebelumnya</button><span>${page+1} / ${pages}</span><button class="btn small" id="landNext" ${page===pages-1?'disabled':''}>Berikutnya →</button></div><div class="cards">${Array.from({length:Math.min(24,d.count-page*24)},(_,n)=>{const i=d.start+page*24+n,owner=state.citizens.find(c=>c.home===i);return `<article class="card"><div class="job-art" style="background:${owner?'#b5c5aa':'#b9d2a1'}">${icon('home')}</div><h3>Petak ${String(i+1).padStart(3,'0')}</h3><p>${owner?'Milik '+esc(owner.name):d.name}</p><div class="card-meta"><strong>${owner?'Terisi':plotPrice(i)+' koin'}</strong><span class="tag">${owner?'Milik warga':'Tersedia'}</span></div><button class="btn small wide" data-view-plot="${i}">Lihat lokasi</button><button class="btn wide" data-plot="${i}" ${owner||p.home!==null?'disabled':''}>${owner?'Ditempati':p.home!==null?'Sudah punya rumah':'Beli tanah & rumah Lv.1'}</button></article>`;}).join('')}</div>`,{sub:d.name.toUpperCase()});
 $$('[data-district]').forEach(b=>b.onclick=()=>showLand(Number(b.dataset.district)));
 $('#landPrev').onclick=()=>showLand(district,page-1);$('#landNext').onclick=()=>showLand(district,page+1);
 $$('[data-view-plot]').forEach(b=>b.onclick=()=>{const pos=world.plotPosition(Number(b.dataset.viewPlot));closePanel();world.navigate(pos.x,pos.z);});
 $$('[data-plot]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.plot),cost=plotPrice(i);confirmBox('Beli petak '+(i+1)+'?',`Harga tanah dan rumah: <b>${cost} koin</b>.<br>Lokasi: ${districtFor(i).name}.<br>Sisa saldo: ${fmt(state.me.coins-state.me.held-cost)} koin.`,async()=>{await SOCIAL.claimPlot(i);await act('buyLand',{plot:i});closePanel();const pos=world.plotPosition(i);world.navigate(pos.x,pos.z);},'Beli rumah');});
}
function showWallet(){const p=state.me;panel('Dompet warga',`<div class="eyebrow">SALDO TERSEDIA</div><div class="balance-number">${fmt(p.coins-p.held)} <small style="font:15px system-ui;color:#8c997f">koin</small></div><p class="intro">${p.held?fmt(p.held)+' koin ditahan untuk pembangunan.':'Uang permainan. Tidak dapat diuangkan atau ditukar menjadi saldo DANA.'}</p><h3 class="section-title">${icon('send')} Kirim koin ke warga</h3><label class="field"><span>Penerima</span><select id="transferTo"><option value="">Pilih warga</option>${state.citizens.filter(x=>x.id!==p.id&&!x.remote).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span>Jumlah koin</span><input class="input" id="transferAmount" type="number" inputmode="numeric" min="1" placeholder="Contoh: 50"></label><button class="btn primary wide" id="transferBtn">Periksa transfer ${icon('arrow')}</button><h3 class="section-title">Riwayat transaksi</h3>${state.ledger.filter(x=>x.actor===p.id).map(x=>`<div class="ledger-row"><div>${esc(x.text)}<span>${niceDate(x.time)}</span></div><strong class="${x.amount<0?'negative':''}">${x.amount>0?'+':''}${fmt(x.amount)}</strong></div>`).join('')||'<div class="empty">Belum ada transaksi.</div>'}`,{sub:'SEMUA TRANSAKSI TERCATAT',narrow:true});$('#transferBtn').onclick=()=>{const to=$('#transferTo').value,n=Number($('#transferAmount').value),target=state.citizens.find(p=>p.id===to);if(!target||!Number.isInteger(n)||n<=0)return toast('Pilih penerima dan jumlah koin yang valid.',true);confirmBox('Kirim koin?',`Penerima: <b>${esc(target.name)}</b><br>Jumlah: <b>${fmt(n)} koin</b><br>Sisa saldo tersedia: ${fmt(state.me.coins-state.me.held-n)} koin.`,async()=>{await act('transfer',{to,amount:n});showWallet();},'Kirim sekarang');};}
function showCitizens(friendsOnly=false){const p=state.me;panel('Tetangga & teman',`<div class="chips"><button class="chip ${!friendsOnly?'active':''}" id="allCitizens">Semua warga · ${state.citizens.length}</button><button class="chip ${friendsOnly?'active':''}" id="friendCitizens">Teman · ${p.friends.length}</button></div>${p.requests.length?'<div class="notice">Ada '+p.requests.length+' permintaan pertemanan. Pilih Terima pada kartu warga.</div>':''}${state.citizens.filter(x=>!friendsOnly||p.friends.includes(x.id)).map(c=>`<div class="citizen-card"><div class="citizen-avatar" style="background:${c.color}">${esc(c.name[0])}</div><div class="grow"><h3>${esc(c.name)}${badge(c.role)}</h3><p>${state.online.some(x=>x.id===c.id)?'● Online':'Offline'} · ${c.jobs} tugas · Kehidupan ${c.life}</p></div>${c.id!==p.id?`<button class="btn small" data-citizen="${c.id}">Lihat</button>`:'<span class="tag">Kamu</span>'}</div>`).join('')||'<div class="empty">Belum ada teman. Kenalan dengan warga di kota.</div>'}`,{sub:'KOMUNITAS NUSA'});$('#allCitizens').onclick=()=>showCitizens(false);$('#friendCitizens').onclick=()=>showCitizens(true);$$('[data-citizen]').forEach(b=>b.onclick=()=>showCitizen(b.dataset.citizen));}
function showCitizen(id){const c=state.citizens.find(x=>x.id===id),p=state.me;if(!c)return;if(c.remote){showKTP(id);return;}const friend=p.friends.includes(id),blocked=p.blocks.includes(id);panel(esc(c.name),`<div class="avatar-preview" style="color:${c.color}">${icon('person')}</div><div class="row" style="justify-content:center">${badge(c.role)}<span class="tag">Warga sejak ${niceDate(c.joined)}</span></div><div class="stats-grid" style="margin-top:22px"><div class="stat-box"><span>Tugas</span><strong>${c.jobs}</strong></div><div class="stat-box"><span>Pengalaman</span><strong>${c.xp}</strong></div><div class="stat-box"><span>Kehidupan</span><strong>${c.life}</strong></div></div><div class="row wrap"><button class="btn primary grow" id="friendAction">${friend?'Pesan pribadi':p.requests.includes(id)?'Terima teman':'Tambah teman'}</button><button class="btn" id="blockAction">${blocked?'Buka blokir':'Blokir'}</button><button class="btn" id="reportAction">Laporkan</button></div>`,{narrow:true,sub:'KARTU WARGA'});$('#friendAction').onclick=async()=>{if(friend){closePanel();openChat('dm:'+([p.id,id].sort().join(':')));return;}try{await act('friend',{to:id});showCitizen(id);}catch{}};$('#blockAction').onclick=async()=>{try{await act('block',{to:id});showCitizen(id);}catch{}};$('#reportAction').onclick=()=>reportForm(id);}

async function openMapTarget(id){beep();
 if(!entered)return join();closePanel();
 if(id.startsWith('project:')){const slot=Number(id.split(':')[1]);world.navigate(-52+slot*15,-71);showVote();return;}
 if(id.startsWith('apt:')){const n=Number(id.slice(4)),pos=APT_POS[n];if(pos)world.navigate(pos[0],pos[1]);showApt(n);return;}
 if(id.startsWith('plot:')){const i=Number(id.split(':')[1]),p=world.plotPosition(i),d=districtFor(i);world.navigate(p.x,p.z);const own=state.citizens.find(c=>c.home===i);if(own&&own.id!==state.me.id){showKTP(own.id);return;}showLand(DISTRICTS.indexOf(d),Math.floor((i-d.start)/24));return;}
 const p=catalog.places.find(p=>p.id===id);if(!p)return;
 world.navigate(p.x,p.z);
 if(catalog.jobs.some(j=>j.workplace===id)){showWorkplace(id);return;}
 if(p.kind==='cafe'){try{await act('heartbeat',world.position(),true);}catch(e){toast('Belum tersambung ke meja kopi. Coba lagi.',true);return;}}

function showGuide(){panel('Buku saku warga',`<p class="intro">Baca satu kartu, langsung coba. Kamu tidak perlu menghafal semuanya.</p><div class="guide-pages">${[['01','plane','Tiba & punya rumah','Buat kartu warga. Kos gratis dan 250 koin langsung tersedia.'],['02','compass','Ketuk bangunan, langsung buka','Kota isometrik hidup dengan lalu lintas dan warga latar otomatis. Geser peta untuk melihat kawasan, lalu ketuk bangunannya.'],['03','heart','Main santai tanpa bar kebutuhan','Lapar dan haus sudah dinonaktifkan. Klinik tetap bisa memulihkan kondisi setelah pekerjaan berisiko.'],['04','work','Terima gaji pertama','Pilih tempat kerja: Bakery, Shopmarket, bengkel, dan lainnya. Selesaikan minimal 1 babak dan minimal sesuai babak, lalu tekan Ambil upah.'],['05','chat','Kenalan dengan tetangga','Warga latar bergerak otomatis. Chat lokal tersedia untuk menguji aturan bahasa. Chat antarpemain memerlukan server.'],['06','home','Beli tempat pulang','Buka menu Rumah → Cari tanah. 240 petak tersedia; lahan baru 420 koin termasuk rumah kecil.'],['07','hall','Ikut membangun kota','Berikan satu suara pada pemilihan 5 hari. Lihat pajak dan proyek melalui Balai Nusa.'],['08','shield','Pahami risiko','Dua pekerjaan biasa membuka misi berbahaya. Kesehatan nol saat bekerja mereset karakter, bukan akun.'],['09','map','Nikmati panorama kota','Cubit layar atau tekan + / − untuk zoom. Tombol Seluruh kota mengembalikan peta ke tampilan utuh.'],['10','camera','Rekam tanpa gangguan','Ketuk ikon kamera untuk menyembunyikan panel. Tombol Selesai mode foto mengembalikan kontrol.'],['11','hall','Panel pemerintahan','Tombol Pemerintahan ada di kiri layar. Presiden mendapat panel Owner; Wakil mendapat panel pelayanan warga sesuai akun yang aktif.']].map(([n,i,t,d])=>`<article class="guide-card"><div class="row spread"><span class="step-number">${n}</span>${icon(i)}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div><div class="notice">Edisi 04: kota hidup, 240 lahan, pekerjaan sesuai bangunan, dan layar tanpa bar kebutuhan. Progres tersimpan di browser HP ini; chat online belum aktif. Suara antar pemain dan interior bebas belum tersedia. Perayaan donasi nyata memerlukan koneksi Trakteer.</div>`,{sub:'PANDUAN SINGKAT · LANGSUNG BISA DICOBA',foot:`<span>Versi TrebEdit: satu pemain, tiga tetangga contoh, dan warga latar otomatis.</span><button class="btn small primary" data-close>Mulai menjelajah ${icon('arrow')}</button>`});}
function showSettings(){panel('Bikin dirimu nyaman',`<label class="field"><span>Kualitas gambar</span><select id="qualitySet">${['low','medium','high'].map((q,i)=>`<option value="${q}" ${settings.quality===q?'selected':''}>${['Ringan','Seimbang','Tinggi'][i]}</option>`).join('')}</select></label><label class="field"><span>Suasana lokal</span><select id="weatherSet">${[['day','Siang jernih'],['auto','Otomatis · waktu WIB'],['sunset','Sore hangat'],['night','Malam tenang'],['rain','Hujan pesisir']].map(([v,n])=>`<option value="${v}" ${settings.weather===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="check"><input type="checkbox" id="soundSet" ${settings.sound?'checked':''}><span>Efek suara tombol & pekerjaan</span></label><label class="check"><input type="checkbox" id="musicSet" ${settings.music?'checked':''}><span>Musik instrumental lembut</span></label><label class="check"><input type="checkbox" id="reduceSet" ${settings.reduced?'checked':''}><span>Kurangi konfeti dan efek perayaan</span></label><button class="btn primary wide" id="saveSettings">Simpan kenyamanan</button><h3 class="section-title" id="acctTitle">Akun & pengelolaan</h3>${ownerOK()?`<button class="btn wide" id="activateBtn">${icon('shield')} Mode Presiden</button><button class="btn wide" style="margin-top:9px" id="boardBtn">${icon('plane')} Daftar penumpang bandara</button><button class="btn wide" style="margin-top:9px" id="ownerOff">Kunci HP ini (keluar mode pemilik)</button>`:''}<button class="btn wide" style="margin-top:9px" data-nav="career">${icon('shield')} Pangkat & EXP</button><button class="btn wide" style="margin-top:9px" data-nav="guide">${icon('book')} Buku panduan</button><button class="btn wide" style="margin-top:9px" id="backupSave">Unduh cadangan progres</button><label class="btn wide" style="margin-top:9px">Impor cadangan<input type="file" id="restoreSave" accept=".json,application/json" hidden></label><p class="intro">Simpanan ini khusus browser dan perangkat  const p=state.me;if(!p)return join();if(p.role==='citizen')return showGovernment();const owner=p.role==='president',staff=owner||p.role==='vice',tabs=officeTabs(p.role);if(!tabs.includes(tab))tab='Ringkasan';let content='';

 if(tab==='Berita'){content=`<p class="intro">Terbitkan kabar resmi ke kotak berita seluruh warga. Tidak memunculkan pop-up yang menutup permainan.</p><label class="field"><span>Judul</span><input class="input" id="newsTitle" maxlength="70" placeholder="Misalnya: Pasar malam hari Sabtu"></label><label class="field"><span>Isi berita</span><textarea id="newsText" maxlength="650" placeholder="Tulis kabar untuk warga…"></textarea></label><button class="btn primary" id="newsPreview">Pratinjau berita ${icon('arrow')}</button>`;}

 if(tab==='Laporan'){

  clock.textContent=pad2(Math.floor(left/3600000))+':'+pad2(Math.floor(left%3600000/60000))+':'+pad2(Math.floor(left%60000/1000));

  if(left<=0){$('#flightLabel').textContent='Mendarat!';land();}};

async function airportBoard(){

 else if(NET.mode()==='ntfy'){try{const list=await NET.ntfyHistory(NUSA_CONFIG.NTFY_AIRPORT_TOPIC,'all');const seen=new Map();for(const x of list){if(x.ig)seen.set(String(x.ig).toLowerCase(),x);}rows=[...seen.values()].sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,100);}catch(e){err=e.message;}}

}

function aptCost(u){return 150+u*25;}
function cleanBio(t){return String(t||'').replace(/https?:\/\/\S+|www\.\S+/gi,'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,90);}
function nikOf(id){let h=2166136261;const out=[];for(let k=0;k<3;k++){for(const ch of String(id)+k){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}out.push(String(h%10000).padStart(4,'0'));}return 'NUSA '+out.join(' ');}
const SOCIAL={
 houses:{},apt:{},sig:'',lastRemote:'',timer:0,denied:false,started:false,busy:false,igTried:false,
 on(){return FB.on()&&!this.denied;},
 async probe(){
  if(!FB.base())return;
  const bad=e=>/ditolak|tidak ditemukan/.test(e&&e.message||'');
  try{await FB.get('chat/global','?orderBy=%22%24key%22&limitToFirst=1');}catch(e){if(bad(e)){FB.dead=true;console.warn('Firebase: chat ditolak, pakai ntfy.');}}
  try{await FB.get('houses','?orderBy=%22%24key%22&limitToFirst=1');}catch(e){if(bad(e)){this.denied=true;console.warn('Firebase: Rules houses belum dipasang.');}}
 },
 start(){
  if(this.started)return;this.started=true;
  this.probe().then(()=>{
   if(!this.on())return;
   this.pull();
   this.timer=setInterval(()=>{if(!document.hidden)this.pull();},6000);
   document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.pull();});
  });
 },
 async pull(){
  if(!this.on())return;
  try{
   const [h,a]=await Promise.all([FB.get('houses'),FB.get('apt')]);
   this.houses=h&&typeof h==='object'?h:{};this.apt=a&&typeof a==='object'?a:{};
   const s=JSON.stringify([this.houses,this.apt]);
   if(s!==this.lastRemote){this.lastRemote=s;if(state.me)absorb({});}
   this.sync();
  }catch(e){}
 },
 merge(list){
  const me=state.me&&state.me.id,local=(list||[]).filter(c=>!c.remote),ids=new Set(local.map(c=>c.id)),used=new Set(local.filter(c=>c.home!==null&&c.home!==undefined).map(c=>c.home));
  const rem=[];
  for(const [k,v] of Object.entries(this.houses||{})){
   if(!v||!v.id||v.free||v.id===me||ids.has(v.id))continue;
   const plot=Number(k);if(!(plot>=0&&plot<240)||used.has(plot))continue;
   rem.push({id:v.id,name:String(v.n||'Warga').slice(0,24),ig:String(v.ig||'').slice(0,30),color:/^#[0-9a-f]{6}$/i.test(v.c)?v.c:'#569d91',role:'citizen',home:plot,houseLevel:Math.max(1,Math.min(20,Number(v.lv)||1)),decor:['sage','coral','blue','sand'].includes(v.dc)?v.dc:'sage',xp:0,jobs:0,life:1,joined:Number(v.j)||0,career:{name:'Warga'},remote:true});
   used.add(plot);
  }
  return local.concat(rem);
 },
 houseRec(p){return {id:p.id,n:p.name,ig:p.ig||'',c:p.color,lv:p.houseLevel||1,dc:p.decor||'sage',j:p.joined||0,t:{'.sv':'timestamp'}};},
 ktpRec(p){return {n:p.name,ig:p.ig||'',bio:p.bio||'',c:p.color,rk:p.career&&p.career.name||'Warga',j:p.joined||0,h:p.home===undefined?null:p.home,a:p.apt||null,l:p.life||1,t:{'.sv':'timestamp'}};},
 async sync(){
  const p=state.me;if(!p||!this.on()||this.busy)return;
  if(!p.ig&&!this.igTried){const f=typeof flightLoad==='function'?flightLoad():null;if(f&&f.ig){this.igTried=true;act('profile',{ig:f.ig}).catch(()=>{this.igTried=false;});return;}}
  const sig=JSON.stringify([p.id,p.name,p.color,p.ig||'',p.bio||'',p.home,p.houseLevel||0,p.decor,p.apt||null,p.career&&p.career.name||'',p.life]);
  if(sig===this.sig)return;
  this.busy=true;
  try{
   await FB.put('ktp/'+p.id,this.ktpRec(p));
   if(p.home!==null&&p.home!==undefined){
    const cur=await FB.get('houses/'+p.home);
    if(!cur||!cur.id||cur.free||cur.id===p.id)await FB.put('houses/'+p.home,this.houseRec(p));else this.conflict=true;
   }else{
    for(const [k,v] of Object.entries(this.houses||{}))if(v&&v.id===p.id&&!v.free)await FB.put('houses/'+k,{id:p.id,free:true});
   }
   if(p.apt){const k=p.apt.t+'_'+p.apt.u,cur=await FB.get('apt/'+k);if(!cur||!cur.id||cur.free||cur.id===p.id)await FB.put('apt/'+k,{id:p.id,n:p.name,ig:p.ig||'',c:p.color});}
   this.sig=sig;
  }catch(e){}finally{this.busy=false;}
 },
 async claimPlot(i){
  if(!this.on())return;
  const me=state.me,fail=()=>{const e=Error('Petak ini baru saja dibeli warga lain. Pilih petak lain.');toast(e.message,true);return e;};
  let cur;
  try{cur=await FB.get('houses/'+i);}catch(e){if(/ditolak|tidak ditemukan/.test(e.message))this.denied=true;else toast('Server belum terhubung. Rumahmu baru tampil di HP lain nanti.',true);return;}
  if(cur&&cur.id&&!cur.free&&cur.id!==me.id){this.pull();throw fail();}
  try{await FB.put('houses/'+i,this.houseRec({...me,houseLevel:1,joined:me.joined}));}
  catch(e){let again=null;try{again=await FB.get('houses/'+i);}catch{}if(again&&again.id&&!again.free&&again.id!==me.id){this.pull();throw fail();}this.denied=true;}
 },
 async claimApt(t,u){
  if(!this.on())return;
  const me=state.me,k=t+'_'+u,fail=()=>{const e=Error('Unit ini baru saja diambil warga lain.');toast(e.message,true);return e;};
  let cur;try{cur=await FB.get('apt/'+k);}catch(e){return;}
  if(cur&&cur.id&&!cur.free&&cur.id!==me.id){this.pull();throw fail();}
  try{await FB.put('apt/'+k,{id:me.id,n:me.name,ig:me.ig||'',c:me.color});}
  catch(e){let again=null;try{again=await FB.get('apt/'+k);}catch{}if(again&&again.id&&!again.free&&again.id!==me.id){this.pull();throw fail();}}
 },
 async releaseApt(t,u){if(!this.on())return;try{await FB.put('apt/'+t+'_'+u,{id:state.me.id,free:true});}catch(e){}},
 tenant(t,u){
  const me=state.me,r=(this.apt||{})[t+'_'+u];
  if(me&&me.apt&&me.apt.t===t&&me.apt.u===u)return {id:me.id,n:me.name,ig:me.ig,mine:true};
  if(r&&r.id&&!r.free&&(!me||r.id!==me.id))return {id:r.id,n:r.n,ig:r.ig};
  return null;
 },
 count(t){let n=0;for(let u=0;u<APT_UNITS;u++)if(this.tenant(t,u))n++;return n;}
};

function showApt(t=0){

  $$('[data-apt-tower]').forEach(b=>b.onclick=()=>showApt(Number(b.dataset.aptTower)));
  $('#aptLocate').onclick=()=>{const pos=APT_POS[t];closePanel();world.navigate(pos[0],pos[1]);};
  $$('[data-apt-ktp]').forEach(b=>b.onclick=()=>showKTP(b.dataset.aptKtp));
  $$('[data-apt-rent]').forEach(b=>b.onclick=()=>{const u=Number(b.dataset.aptRent),cost=aptCost(u);
   confirmBox('Tinggal di sini?',`Apartemen ${t+1}, lantai ${u+1}.<br>Harga: <b>${cost} koin</b>.<br>Sisa saldo: ${fmt(avail-cost)} koin.`,async()=>{
    try{await SOCIAL.claimApt(t,u);await act('rentApt',{tower:t,unit:u,cost});showApt(t);}catch(e){if(e&&e.message)toast(e.message,true);throw e;}},'Pindah ke sini');});

function drawKTP(cv,d){

  c.strokeStyle='rgba(169,219,192,.13)';c.lineWidth=2;
  for(let k=0;k<7;k++){c.beginPath();for(let x=0;x<=W;x+=12){const y=150+k*38+Math.sin(x/46+k)*9;x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();}
  c.fillStyle='#fff9ec';c.fillRect(0,0,W,76);
  c.fillStyle='#569d91';c.beginPath();c.arc(48,38,22,0,7);c.fill();
  c.fillStyle='#fff9ec';c.font='800 24px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('N',48,39);
  c.textAlign='left';c.fillStyle='#123b3e';c.font='800 26px system-ui,sans-serif';c.fillText('KOTA NUSA',84,30);
  c.fillStyle='#5f8a80';c.font='700 11px system-ui,sans-serif';c.fillText('KARTU PENDUDUK  ·  SEBUAH KEHIDUPAN BARU',84,55);
  c.fillStyle='#e3ad94';c.beginPath();c.arc(W-44,38,10,0,7);c.fill();c.fillStyle='#a9dbc0';c.beginPath();c.arc(W-66,38,10,0,7);c.fill();c.fillStyle='#6494ac';c.beginPath();c.arc(W-88,38,10,0,7);c.fill();
  // foto
  c.fillStyle=d.color;rr(36,100,156,190,18);c.fill();

  const V=(t,x,y,size,maxW,wt)=>{c.fillStyle='#fff9ec';c.font=(wt||'700')+' '+size+'px system-ui,sans-serif';c.textAlign='left';c.fillText(t,x,y,maxW);};
  L('NIK NUSA',224,108);V(nik,224,136,30,456,'800');

  L('WARGA SEJAK',224,316);V(d.joined?new Date(d.joined).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—',224,340,20,200,'600');
  // deskripsi

  L('DESKRIPSI',54,366);

  c.fillStyle='#fff9ec';c.textAlign='left';lines.forEach((t,i)=>c.fillText(t,54,390+i*22,616));

  ctx.fillStyle='#183b50';ctx.fillRect(0,0,600,330);

 };

 const kd=e=>{const x={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key];if(x&&s.active){e.preventDefault();s.keys.add(x);}};
